name: OpenCL

# OpenCL on the Mali-G52: Mesa 26.2's rusticl frontend on Panfrost, built for
# Windows ARM64 as malicl_arm64.dll, an OpenCL ICD for the Khronos loader
# (docs/OPENCL.md). Separate from mesa.yml on purpose: nothing here goes into
# the Direct3D UMD or the OpenGL ICD, and mesa-patches-cl/ is applied only by
# this workflow.
#
# rusticl compiles OpenCL C when the application asks (clBuildProgram), so the
# DLL carries clang, LLVM and the SPIR-V translator, linked statically. LLVM
# is the LLVM project's own Windows ARM64 release (clang+llvm-*-aarch64-pc-
# windows-msvc, static libraries and CMake files included), cached. Its
# libraries use the static C runtime (/MT, /DEFAULTLIB:libcmt.lib), as the
# D3D UMD and the GL ICD do, so the whole of this build does, Rust's
# standard library included (+crt-static): the ICD needs no runtime DLL.

on:
  push:
    paths:
      - '.github/workflows/opencl.yml'
      - 'mesa-patches/**'
      - 'mesa-patches-cl/**'
      - 'win32-compat/**'
      - 'include/**'
      - 'video/**'
      - 'tools/windows/cltest/**'
      - 'ci/meson-rust-dedup.py'
      - 'ci/bindgen-unsigned-enums.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_TAG: mesa-26.2.0
  MESA_URL: https://github.com/chaotic-cx/mesa-mirror.git
  LLVM_VER: '20.1.8'
  SPIRV_LLVM_TAG: v20.1.9
  SPIRV_TAG: vulkan-sdk-1.4.321.0
  CL_HEADERS_TAG: v2026.05.29
  CL_LOADER_TAG: v2026.05.29
  CLINFO_TAG: 3.0.25.02.14
  PKGCONF_TAG: pkgconf-2.3.0
  BINDGEN_VER: 0.71.1
  # Bumped by hand to throw a cache away.
  DEPS_REV: '2'

jobs:
  linux:
    # 1. cltest itself, against a known-good OpenCL (PoCL on the CPU): a
    #    failure on the board then says something about the driver, not the
    #    test. 2. libclc's SPIR-V (Ubuntu's libclc-20, platform independent),
    #    which Mesa links into the DLL (-Dstatic-libclc=all).
    name: cltest on PoCL, libclc SPIR-V (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pocl-opencl-icd ocl-icd-opencl-dev opencl-headers clinfo
      - name: cltest on PoCL
        run: |
          gcc -O2 -Wall -Wextra -Werror -Wno-deprecated-declarations -std=c11 -D_POSIX_C_SOURCE=199309L \
            tools/windows/cltest/cltest.c -o cltest -lOpenCL -lm
          clinfo -l
          ./cltest list
          ./cltest vecadd 1048576
          ./cltest sgemm 256 3
          ./cltest sgemm 64 1
      - name: libclc SPIR-V
        run: |
          mkdir -p deb libclc
          (cd deb && apt-get download libclc-20)
          dpkg -x deb/libclc-20_*.deb x
          find x -name '*mesa3d*.spv' -exec cp {} libclc/ \;
          ls -la libclc
          test -f libclc/spirv64-mesa3d-.spv && test -f libclc/spirv-mesa3d-.spv
      - uses: actions/upload-artifact@v4
        with:
          name: libclc-spv
          path: libclc/

  rusticl:
    name: rusticl + Panfrost + softpipe (ARM64)
    needs: linux
    runs-on: windows-11-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libclc-spv
          path: C:\libclc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # meson pinned: ci\meson-rust-dedup.py edits this version's backend.
          python -m pip install meson==1.12.1 ninja mako pyyaml packaging
          python ci\meson-rust-dedup.py
          if ($LASTEXITCODE) { throw 'meson patch failed' }
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          meson --version
          Get-PSDrive C | Format-Table Name, Used, Free

      - name: Rust
        shell: pwsh
        run: |
          $cargo = Join-Path $env:USERPROFILE '.cargo\bin'
          if (-not (Get-Command rustc -ErrorAction SilentlyContinue) -and -not (Test-Path "$cargo\rustc.exe")) {
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain stable --component rustfmt
            if ($LASTEXITCODE) { throw 'rustup-init failed' }
          }
          $cargo | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$cargo;$env:PATH"
          rustup component add rustfmt 2>&1 | Out-Host
          rustc -vV
          cargo --version

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # Restore and save are separate steps so that a later failure still
      # leaves the caches saved.
      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VER }}-aarch64-windows-msvc-pruned-${{ env.DEPS_REV }}

      - name: LLVM (the LLVM project's Windows ARM64 release)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $n = "clang+llvm-$env:LLVM_VER-aarch64-pc-windows-msvc"
          $u = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VER/$n.tar.xz"
          curl.exe -sSL --retry 3 -o C:\llvm.tar.xz $u
          if ($LASTEXITCODE) { throw "download failed: $u" }
          (Get-Item C:\llvm.tar.xz).Length
          New-Item -ItemType Directory -Force C:\llvm-x | Out-Null
          tar -xf C:\llvm.tar.xz -C C:\llvm-x
          if ($LASTEXITCODE) {
            Write-Host 'tar could not unpack .xz; 7-Zip'
            cmd /c "7z x -so C:\llvm.tar.xz | 7z x -si -ttar -oC:\llvm-x" | Select-Object -Last 3
          }
          Remove-Item C:\llvm.tar.xz
          Move-Item "C:\llvm-x\$n" C:\llvm
          # What Mesa and the translator need: headers, CMake files, the
          # static libraries of LLVM and clang, clang's own headers
          # (opencl-c.h), llvm-config, and libclang.dll for bindgen.
          $keepBin = 'llvm-config.exe', 'libclang.dll', 'clang.exe', 'llvm-link.exe', 'opt.exe', 'llvm-as.exe', 'llvm-dis.exe'
          Get-ChildItem C:\llvm\bin | Where-Object { $keepBin -notcontains $_.Name } | Remove-Item -Recurse -Force
          Get-ChildItem C:\llvm\lib -File | Where-Object { $_.Name -match '^(liblldb|lldb|lld|LLVM-C|libomp|libiomp|omp)' } | Remove-Item -Force
          Remove-Item -Recurse -Force C:\llvm\lib\clang\*\lib -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force C:\llvm\share, C:\llvm\libexec, C:\llvm\include\lldb -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force C:\llvm-x
          "{0:N0} MB left" -f ((Get-ChildItem C:\llvm -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/cache/save@v4
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        with:
          path: C:\llvm
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: LLVM check
        shell: pwsh
        run: |
          "C:\llvm\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\llvm\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & C:\llvm\bin\llvm-config.exe --version --build-mode --shared-mode --system-libs
          Get-ChildItem C:\llvm\lib -Filter 'clang*.lib' | Measure-Object | ForEach-Object { "clang libraries: $($_.Count)" }
          Get-ChildItem C:\llvm\lib -Filter 'LLVM*.lib' | Measure-Object | ForEach-Object { "LLVM libraries: $($_.Count)" }
          if (-not (Test-Path C:\llvm\lib\cmake\llvm\LLVMConfig.cmake)) { throw 'no LLVMConfig.cmake in the release' }
          # LLVM's CMake exports check that every file they name exists, and
          # the cache leaves out tools and the lldb, lld and OpenMP
          # libraries: empty stand-ins for those (nothing here runs or links
          # them).
          $n = 0
          Get-ChildItem C:\llvm\lib\cmake -Recurse -Filter '*Exports-*.cmake' | ForEach-Object {
            Select-String -Path $_.FullName -Pattern '\$\{_IMPORT_PREFIX\}/((bin|lib)/[^" ;]+\.(exe|dll|lib))' -AllMatches | ForEach-Object { $_.Matches } | ForEach-Object {
              $f = Join-Path C:\llvm $_.Groups[1].Value
              if (-not (Test-Path $f)) { New-Item -ItemType File -Force $f | Out-Null; $n++ }
            }
          }
          "empty stand-ins for $n pruned files"
          # LLVMDebugInfoPDB names the DIA SDK of the machine the release was
          # built on; point it at this runner's.
          $dia = (Join-Path $env:VSINSTALLDIR 'DIA SDK\lib\arm64\diaguids.lib') -replace '\\', '/'
          if (-not (Test-Path $dia)) { Write-Host "::warning::no $dia" }
          Get-ChildItem C:\llvm\lib\cmake -Recurse -Filter '*.cmake' | ForEach-Object {
            $t = Get-Content -Raw $_.FullName
            $u = [regex]::Replace($t, '[A-Za-z]:/[^;"]*?DIA SDK/lib/arm64/diaguids\.lib', $dia)
            if ($u -ne $t) { [IO.File]::WriteAllText($_.FullName, $u); Write-Host "DIA SDK path fixed in $($_.Name)" }
          }
          if (-not (Get-ChildItem C:\llvm\lib\clang -Recurse -Filter opencl-c.h)) { throw 'no opencl-c.h in the release' }
          dumpbin /nologo /directives C:\llvm\lib\LLVMSupport.lib | Select-String 'DEFAULTLIB' | Select-Object -Unique -First 6 | ForEach-Object { $_.Line.Trim() }

      - name: Cache the other dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\cldeps
          key: cldeps-${{ env.LLVM_VER }}-${{ env.SPIRV_LLVM_TAG }}-${{ env.SPIRV_TAG }}-${{ env.PKGCONF_TAG }}-${{ env.BINDGEN_VER }}-${{ env.DEPS_REV }}

      - name: pkgconf, SPIRV-Tools, SPIRV-LLVM-Translator, bindgen
        if: steps.deps-cache.outputs.cache-hit != 'true'
        timeout-minutes: 120
        shell: pwsh
        run: |
          $p = 'C:\cldeps'
          New-Item -ItemType Directory -Force $p, deps | Out-Null
          function Clone($url, $tag, $dir) {
            git clone -q --depth 1 --branch $tag $url $dir
            if ($LASTEXITCODE) { throw "clone failed: $url $tag" }
          }
          # Not named CMake: PowerShell would call the function from itself.
          function Build-CMake($src, $bld) {
            Write-Host "== $src $(Get-Date -Format HH:mm:ss)"
            # cl.exe by name: C:\llvm\bin has a clang.exe that CMake
            # would otherwise take for C.
            cmake -S $src -B $bld -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
              -DCMAKE_INSTALL_PREFIX=C:/cldeps "-DCMAKE_PREFIX_PATH=C:/cldeps;C:/llvm" @args
            if ($LASTEXITCODE) { throw "cmake failed: $src" }
            ninja -C $bld install
            if ($LASTEXITCODE) { throw "build failed: $src" }
          }

          # pkg-config, which meson needs for libclc, SPIRV-Tools and the
          # translator.
          Clone https://github.com/pkgconf/pkgconf.git $env:PKGCONF_TAG deps\pkgconf
          meson setup deps\pkgconf-b deps\pkgconf --buildtype=release -Db_vscrt=md "--prefix=$p" -Dtests=disabled
          if ($LASTEXITCODE) { throw 'pkgconf setup failed' }
          meson install -C deps\pkgconf-b
          if ($LASTEXITCODE) { throw 'pkgconf build failed' }

          Clone https://github.com/KhronosGroup/SPIRV-Headers.git $env:SPIRV_TAG deps\SPIRV-Headers
          # Forward slashes: SPIRV-Tools puts this path into CMake strings.
          $hdr = "$pwd/deps/SPIRV-Headers" -replace '\\', '/'
          Build-CMake deps\SPIRV-Headers deps\SPIRV-Headers-b
          Clone https://github.com/KhronosGroup/SPIRV-Tools.git $env:SPIRV_TAG deps\SPIRV-Tools
          Build-CMake deps\SPIRV-Tools deps\SPIRV-Tools-b "-DSPIRV-Headers_SOURCE_DIR=$hdr" `
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON -DSPIRV_WERROR=OFF -DSPIRV_TOOLS_BUILD_STATIC=ON

          Clone https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git $env:SPIRV_LLVM_TAG deps\SPIRV-LLVM-Translator
          # The translator wants the SPIRV-Headers commit it names
          # (spirv-headers-tag.conf), which is newer than the SDK tag's.
          $hc = (Get-Content deps\SPIRV-LLVM-Translator\spirv-headers-tag.conf -Raw).Trim()
          git init -q deps\SPIRV-Headers-tr
          git -C deps\SPIRV-Headers-tr fetch -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git $hc
          git -C deps\SPIRV-Headers-tr checkout -q FETCH_HEAD
          if ($LASTEXITCODE) { throw "SPIRV-Headers $hc" }
          $hdrTr = "$pwd/deps/SPIRV-Headers-tr" -replace '\\', '/'
          Build-CMake deps\SPIRV-LLVM-Translator deps\SPIRV-LLVM-Translator-b -DLLVM_DIR=C:/llvm/lib/cmake/llvm `
            "-DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR=$hdrTr" -DLLVM_SPIRV_INCLUDE_TESTS=OFF `
            -DLLVM_SPIRV_BUILD_EXTERNAL=YES -DBUILD_SHARED_LIBS=OFF

          Write-Host "== bindgen $(Get-Date -Format HH:mm:ss)"
          cargo install bindgen-cli --version $env:BINDGEN_VER --locked --root $p
          if ($LASTEXITCODE) { throw 'cargo install bindgen-cli failed' }
          Remove-Item -Recurse -Force deps

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: C:\cldeps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Dependencies check
        shell: pwsh
        run: |
          $p = 'C:\cldeps'
          "$p\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # libclc: a .pc for the SPIR-V from the Linux job. In lib\pkgconfig
          # with libexecdir under ${prefix}: pkgconf on Windows sets prefix
          # from where the .pc is (two levels up) and rewrites the old
          # prefix in the other variables, which left libexecdir "C:" when
          # the .pc was one level down (run 45760942680).
          $pc = "prefix=C:/libclc`nlibexecdir=`${prefix}`n`nName: libclc`nDescription: libclc SPIR-V (Ubuntu libclc-20)`nVersion: 20.1.2`n"
          New-Item -ItemType Directory -Force C:\libclc\lib\pkgconfig | Out-Null
          # WriteAllText, not Set-Content: on this runner Set-Content had no
          # -Encoding parameter in this step (run 45567555144).
          [IO.File]::WriteAllText('C:\libclc\lib\pkgconfig\libclc.pc', $pc)
          "PKG_CONFIG_PATH=$p\lib\pkgconfig;$p\share\pkgconfig;C:\libclc\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG=$p\bin\pkgconf.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # pkgconf is installed in C:\cldeps, so it takes C:\cldeps\include
          # for a system directory and drops -I for it: SPIRV-Tools' headers
          # were not found (run 45761462682). Keep the flags.
          "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:PKG_CONFIG_ALLOW_SYSTEM_CFLAGS = '1'
          "LIB=$p\lib;$env:LIB" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:PKG_CONFIG_PATH = "$p\lib\pkgconfig;$p\share\pkgconfig;C:\libclc\lib\pkgconfig"
          & "$p\bin\pkgconf.exe" --modversion LLVMSPIRVLib SPIRV-Tools libclc
          $lx = & "$p\bin\pkgconf.exe" --variable=libexecdir libclc
          Write-Host "libclc libexecdir: $lx"
          foreach ($m in 'SPIRV-Tools', 'LLVMSPIRVLib') {
            $cf = & "$p\bin\pkgconf.exe" --cflags $m
            Write-Host "$m cflags: $cf"
            if ("$cf" -notmatch '-I') { throw "$m has no -I in its cflags" }
          }
          if (-not (Test-Path (Join-Path $lx 'spirv64-mesa3d-.spv'))) { throw "no spirv64-mesa3d-.spv in libexecdir '$lx'" }
          if ($LASTEXITCODE) { Get-ChildItem -Recurse $p -Filter *.pc | ForEach-Object { $_.FullName }; throw 'a .pc file is missing' }
          & "$p\bin\bindgen.exe" --version
          Get-ChildItem "$p\lib" -Filter *.lib | Format-Table Name, Length

      - name: libxml2, which the LLVM release names as a system library
        shell: pwsh
        run: |
          # llvm-config --system-libs lists xml2s.lib (the release was built
          # with libxml2 for llvm-mt), and every program linked with LLVM's
          # static libraries asks for it (run 45762628292, mesa_clc.exe).
          git clone -q --depth 1 --branch v2.13.8 https://github.com/GNOME/libxml2.git xml2
          if ($LASTEXITCODE) { throw 'libxml2 clone failed' }
          cmake -S xml2 -B xml2-b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DBUILD_SHARED_LIBS=OFF -DLIBXML2_WITH_ICONV=OFF -DLIBXML2_WITH_LZMA=OFF -DLIBXML2_WITH_ZLIB=OFF `
            -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_PROGRAMS=OFF -DLIBXML2_WITH_TESTS=OFF `
            -DLIBXML2_WITH_HTTP=OFF -DLIBXML2_WITH_FTP=OFF
          if ($LASTEXITCODE) { throw 'libxml2 cmake failed' }
          ninja -C xml2-b
          if ($LASTEXITCODE) { throw 'libxml2 build failed' }
          New-Item -ItemType Directory -Force C:\xml2 | Out-Null
          $l = Get-ChildItem xml2-b -Filter '*.lib' | Select-Object -First 1
          if (-not $l) { throw 'no libxml2 .lib' }
          Copy-Item $l.FullName C:\xml2\xml2s.lib
          Copy-Item $l.FullName C:\xml2\libxml2s.lib
          "LIB=C:\xml2;$env:LIB" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$($l.Name) as C:\xml2\xml2s.lib"

      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          Copy-Item -Recurse video mesa\src\gallium\frontends\d3d10umd\video
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Copy-Item include\maliwddm_abi.h mesa\include\win32-compat\
          foreach ($d in 'mesa-patches', 'mesa-patches-cl') {
            Get-ChildItem $d -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
              Write-Host "applying $d/$($_.Name)"
              git -C mesa apply --whitespace=nowarn $_.FullName
              if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
            }
          }
          # LLVM through llvm-config (native.ini names C:\llvm's), not
          # meson's CMake lookup, which on Windows comes first and took the
          # runner's LLVM 22.1 although CMAKE_PREFIX_PATH named C:\llvm
          # (runs 45759617805, 45760352894).
          $mb = 'mesa\meson.build'
          $t = [IO.File]::ReadAllText((Resolve-Path $mb))
          $u = $t.Replace("method : host_machine.system() == 'windows' ? 'auto' : 'config-tool',", "method : 'config-tool',")
          if ($u -eq $t) { throw "meson.build: the LLVM method line is not there" }
          [IO.File]::WriteAllText((Resolve-Path $mb), $u)

      - name: Configure
        shell: pwsh
        run: |
          # clang-cl as for the other Panfrost builds; the static C runtime
          # (b_vscrt=mt), which the LLVM release's libraries use, and Rust's
          # standard library linked the same way (+crt-static).
          $cc = (Join-Path $env:VCINSTALLDIR 'Tools\Llvm\ARM64\bin\clang-cl.exe') -replace '\\', '/'
          # bindgen through ci\bindgen-unsigned-enums.py: C enums typed as
          # rusticl expects (unsigned when no value is negative).
          $wrap = "$pwd/ci/bindgen-unsigned-enums.py" -replace '\\', '/'
          [IO.File]::WriteAllText("$pwd\native.ini", ("[binaries]`nc = '$cc'`ncpp = '$cc'`n" +
            "llvm-config = 'C:/llvm/bin/llvm-config.exe'`nbindgen = ['python', '$wrap']`n" +
            "pkg-config = 'C:/cldeps/bin/pkgconf.exe'`n" +
            "[built-in options]`npkg_config_path = ['C:/cldeps/lib/pkgconfig', 'C:/cldeps/share/pkgconfig', 'C:/libclc/lib/pkgconfig']`n" +
            "cmake_prefix_path = ['C:/llvm', 'C:/cldeps']`n"))
          # meson looks LLVM up through CMake on Windows, and without a
          # prefix it took the runner's own LLVM (22.1, in Program Files),
          # whose major does not match the translator's (run 45759617805).
          $env:CMAKE_PREFIX_PATH = 'C:/llvm;C:/cldeps'
          $env:LLVM_DIR = 'C:/llvm/lib/cmake/llvm'
          # bindgen parses rusticl's C++ headers with the release's libclang
          # (20); this runner's MSVC STL wants clang 22 unless told
          # otherwise (run 45762628292, rusticl_llvm_bindings.rs).
          "BINDGEN_EXTRA_CLANG_ARGS=-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Content native.ini
          meson setup build mesa --backend=ninja --native-file native.ini `
            -Dbuildtype=debugoptimized -Db_vscrt=mt '-Drust_args=-Ctarget-feature=+crt-static' `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-rusticl=true `
            -Dgallium-d3d10umd=false `
            -Dmesa-clc=enabled `
            -Dllvm=enabled -Dshared-llvm=disabled `
            -Dstatic-libclc=all `
            -Dspirv-tools=enabled `
            '-Dvulkan-drivers=' `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            "-Dc_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" "-Dcpp_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 150 }; throw 'meson setup failed' }
          $v = Select-String -Path build\meson-logs\meson-log.txt -Pattern 'Run-time dependency LLVM .* found: YES (\S+)' | Select-Object -Last 1
          Write-Host "LLVM: $($v.Line)"
          if ($v -and $v.Matches[0].Groups[1].Value -notlike "$env:LLVM_VER*") { throw "meson took LLVM $($v.Matches[0].Groups[1].Value), not C:\llvm ($env:LLVM_VER)" }

      - name: Build
        timeout-minutes: 150
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log | Select-String -Pattern '^\[\d+/\d+\]' -NotMatch | Select-Object -Last 400
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern 'FAILED:' | Select-Object -First 40 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }

      - name: The ICD
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $f = Get-ChildItem build\src\gallium\targets\rusticl -Filter 'RusticlOpenCL*.dll' | Select-Object -First 1
          if (-not $f) { throw 'RusticlOpenCL.dll was not built' }
          Copy-Item $f.FullName out\malicl_arm64.dll
          Copy-Item ($f.FullName -replace '\.dll$', '.pdb') out\malicl_arm64.pdb -ErrorAction SilentlyContinue
          "{0}: {1:N1} MB" -f $f.Name, ($f.Length / 1MB)
          dumpbin /nologo /headers out\malicl_arm64.dll | Select-String 'machine' | Select-Object -First 1 | ForEach-Object { $_.Line.Trim() }
          $ex = @(dumpbin /nologo /exports out\malicl_arm64.dll | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] } })
          Write-Host "exports: $($ex -join ' ')"
          foreach ($n in 'clIcdGetPlatformIDsKHR', 'clGetPlatformInfo', 'clGetExtensionFunctionAddress') {
            if ($ex -notcontains $n) { throw "$n is not exported" }
          }
          $imp = @(dumpbin /nologo /dependents out\malicl_arm64.dll | Select-String '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() })
          Write-Host "imports: $($imp -join ', ')"
          # Windows' own DLLs only: an ICD is loaded into any ARM64 program
          # and must not need a runtime DLL beside it.
          $ok = '^(kernel32|user32|gdi32|advapi32|ws2_32|ole32|oleaut32|shell32|bcrypt|bcryptprimitives|ntdll|userenv|synchronization|dbghelp|version|psapi|crypt32|secur32|api-ms-win-[a-z0-9-]+)\.dll$'
          $odd = @($imp | Where-Object { $_ -notmatch $ok })
          if ($odd.Count) { throw "malicl_arm64.dll imports $($odd -join ', ')" }

      - name: Khronos ICD loader, clinfo, cltest
        shell: pwsh
        run: |
          git clone -q --depth 1 --branch $env:CL_HEADERS_TAG https://github.com/KhronosGroup/OpenCL-Headers.git clh
          git clone -q --depth 1 --branch $env:CL_LOADER_TAG https://github.com/KhronosGroup/OpenCL-ICD-Loader.git cll
          cmake -S cll -B cll-b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            "-DOPENCL_ICD_LOADER_HEADERS_DIR=$pwd\clh"
          if ($LASTEXITCODE) { throw 'loader cmake failed' }
          ninja -C cll-b
          if ($LASTEXITCODE) { throw 'loader build failed' }
          Copy-Item cll-b\OpenCL.dll out\
          $lib = (Get-ChildItem cll-b -Recurse -Filter OpenCL.lib | Select-Object -First 1).FullName
          cl /nologo /O2 /MT /W3 /Iclh tools\windows\cltest\cltest.c /Fe:out\cltest.exe $lib
          if ($LASTEXITCODE) { throw 'cltest build failed' }
          git clone -q --depth 1 --branch $env:CLINFO_TAG https://github.com/Oblomov/clinfo.git clinfo
          cl /nologo /O2 /MT /Iclh clinfo\src\clinfo.c /Fe:out\clinfo.exe $lib
          if ($LASTEXITCODE) { Write-Host '::warning::clinfo did not build; cltest list stands in for it' }
          Get-ChildItem out | Format-Table Name, Length

      - name: Tests on the runner
        timeout-minutes: 40
        shell: pwsh
        run: |
          $cdb = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\arm64\\' } | Select-Object -First 1).FullName
          $exe = (Resolve-Path out\cltest.exe).Path
          # The Khronos loader takes the ICD from OCL_ICD_FILENAMES here; on
          # the board it finds it through the adapter's OpenCLDriverName.
          $env:OCL_ICD_FILENAMES = (Resolve-Path out\malicl_arm64.dll).Path
          function Run-Cl($tag, $argv, $limit = 900) {
            $p = Start-Process -FilePath $exe -ArgumentList $argv -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$tag.out" -RedirectStandardError "$tag.err" -WorkingDirectory (Resolve-Path out).Path
            if (-not $p.WaitForExit($limit * 1000)) {
              Write-Host "${tag}: still running after $limit s, dumping threads"
              if ($cdb) { & $cdb -p $p.Id -y "$pwd\out" -c '.lines -e; ~*kn 40; q' 2>&1 | Out-File "$tag-hang.txt" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $code = 'hang'
            } else {
              $code = $p.ExitCode
              if ($code -lt 0 -and $cdb) {
                & $cdb -g -G -y "$pwd\out" -c '.lines -e; kn 40; r; q' $exe $argv.Split(' ') 2>&1 | Out-File "$tag-crash.txt"
              }
            }
            Write-Host "== ${tag} (cltest $argv): exit code $code"
            Get-Content "$tag.out" -ErrorAction SilentlyContinue | Out-Host
            Get-Content "$tag.err" -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 40 | ForEach-Object { "stderr: $($_.Line)" } | Out-Host
            foreach ($f in "$tag-hang.txt", "$tag-crash.txt") {
              if (Test-Path $f) { Get-Content $f | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 120 | Out-Host }
            }
            return $code
          }
          $fails = @()

          # 1. As on a machine with no Mali, or with OpenCL unused: the
          # platform is there, Panfrost finds no adapter, no device, no
          # crash.
          $c = Run-Cl 'none' 'list'
          if ($c -ne 0) { $fails += "list with no Mali ($c)" }
          if (-not (Select-String -Path none.out -Pattern 'rusticl' -Quiet)) { $fails += 'the rusticl platform is not listed' }
          if (-not (Select-String -Path none.out -Pattern '^\s+devices: 0' -Quiet)) { $fails += 'a device was listed with no Mali' }

          # 2. rusticl on softpipe (RUSTICL_ENABLE=swrast): the frontend,
          # the OpenCL C compiler, the kernels' results.
          $env:RUSTICL_ENABLE = 'swrast'
          $c = Run-Cl 'soft-list' 'list'
          if ($c -ne 0) { $fails += "list on softpipe ($c)" }
          $c = Run-Cl 'soft-vecadd' 'vecadd 65536'
          if ($c -ne 0) { $fails += "vecadd on softpipe ($c)" }
          $c = Run-Cl 'soft-sgemm' 'sgemm 64 1'
          if ($c -ne 0) { $fails += "sgemm on softpipe ($c)" }
          Remove-Item Env:RUSTICL_ENABLE

          # 3. Panfrost on the shim's in-process stand-in for the kernel
          # driver (MALIKM_FAKE=1), with the default RUSTICL_ENABLE: the
          # device is the Mali-G52, OpenCL C goes through SPIR-V and NIR to
          # Bifrost code, compute jobs are submitted. Nothing runs them, so
          # results are not checked.
          $env:MALIKM_FAKE = '1'
          $c = Run-Cl 'fake-list' 'list'
          if ($c -ne 0) { $fails += "list on Panfrost ($c)" }
          if (-not (Select-String -Path fake-list.out -Pattern 'Mali' -Quiet)) { $fails += 'no Mali device on the emulated kernel driver' }
          $c = Run-Cl 'fake-vecadd' '--expect Mali --no-verify vecadd 4096'
          if ($c -ne 0) { $fails += "vecadd on Panfrost ($c)" }
          $c = Run-Cl 'fake-sgemm' '--expect Mali --no-verify sgemm 64 1'
          if ($c -ne 0) { $fails += "sgemm on Panfrost ($c)" }
          if (-not (Select-String -Path fake-vecadd.err -Pattern 'malikm-fake: submit' -Quiet)) { Write-Host '::warning::no "malikm-fake: submit" line in the vecadd log' }
          Remove-Item Env:MALIKM_FAKE

          # 4. The off switch: MALIKM_OPENCL=0 hides the Mali.
          $env:MALIKM_FAKE = '1'; $env:MALIKM_OPENCL = '0'
          $c = Run-Cl 'off' 'list'
          if (Select-String -Path off.out -Pattern 'Mali' -Quiet) { $fails += 'MALIKM_OPENCL=0 did not hide the Mali' }
          Remove-Item Env:MALIKM_FAKE, Env:MALIKM_OPENCL

          if (Test-Path out\clinfo.exe) {
            $env:RUSTICL_ENABLE = 'swrast'
            & out\clinfo.exe 2>&1 | Select-Object -First 120 | Out-File clinfo-softpipe.txt
            Get-Content clinfo-softpipe.txt | Out-Host
            Remove-Item Env:RUSTICL_ENABLE
          }
          if ($fails.Count) { throw ("failed: " + ($fails -join '; ')) }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencl-test-logs
          path: |
            *.out
            *.err
            *-hang.txt
            *-crash.txt
            clinfo-softpipe.txt
            build.log
            build/meson-logs/meson-log.txt
            build/src/gallium/frontends/rusticl/*.rs

      - uses: actions/upload-artifact@v4
        with:
          name: malicl-arm64
          path: out/
          if-no-files-found: error
