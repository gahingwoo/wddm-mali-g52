name: Mesa

# M2: Mesa 26.2 (the last release with the d3d10umd frontend) built natively
# for Windows ARM64, with a D3D11 smoke test run on the runner.

on:
  push:
    paths:
      - '.github/workflows/mesa.yml'
      - 'mesa-patches/**'
      - 'tests/**'
      - 'ci/**'
      - 'win32-compat/**'
      - 'include/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_TAG: mesa-26.2.0
  # gitlab.freedesktop.org was returning 502/504 when this was written; the
  # GitHub mirror carries the same tags.
  MESA_URL: https://github.com/chaotic-cx/mesa-mirror.git

jobs:
  softpipe:
    name: d3d10umd + softpipe (ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          # flex/bison: x64 binaries, run under emulation on ARM64 Windows.
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }

      - name: Configure
        shell: pwsh
        run: |
          meson setup build mesa --backend=ninja `
            -Dbuildtype=release `
            -Dplatforms=windows `
            -Dgallium-drivers=softpipe `
            -Dgallium-d3d10umd=true `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false
          if ($LASTEXITCODE) { Get-Content build\meson-logs\meson-log.txt -Tail 80; throw 'meson setup failed' }

      - name: Build
        shell: pwsh
        run: |
          meson compile -C build
          if ($LASTEXITCODE) { throw 'build failed' }
          Get-ChildItem build -Recurse -Filter *.dll | Format-Table FullName, Length

      - name: D3D11 smoke test
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "smoke test failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll, triangle.exe out\

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-softpipe-arm64
          path: out/

  libpan-spirv:
    # Panfrost precompiles a few OpenCL C kernels (libpan). mesa_clc needs
    # LLVM and clang, which the Windows build avoids: generate the SPIR-V and
    # vtn_bindgen2's C++ here (both platform independent) and hand them over.
    name: libpan SPIR-V (Linux, LLVM)
    runs-on: ubuntu-24.04
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev \
            libllvmspirvlib-18-dev spirv-tools glslang-tools libdrm-dev \
            python3-mako python3-yaml python3-packaging bison flex pkg-config \
            libexpat1-dev zlib1g-dev ninja-build
          python3 -m pip install --break-system-packages meson
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Mesa source
        run: |
          git clone --depth 1 --branch "$MESA_TAG" "$MESA_URL" mesa
          for p in repo/mesa-patches/*.patch; do echo "applying $p"; git -C mesa apply --whitespace=nowarn "$PWD/$p"; done
      - name: Bifrost packing equals GCC's layout
        run: |
          # mesa-patches/0003 replaces memcpy-of-bitfield-struct with explicit
          # packing so MSVC builds encode instructions correctly. Prove the two
          # agree where GCC's layout is still the reference.
          gcc -O1 -w -DHAVE_FUNC_ATTRIBUTE_PACKED -Imesa/src -Imesa/include \
            -Imesa/src/panfrost/compiler/bifrost repo/tests/bifrost-pack/check.c -o bpcheck
          ./bpcheck
      - name: Configure
        run: |
          meson setup build mesa -Dbuildtype=release \
            -Dgallium-drivers=panfrost -Dvulkan-drivers= -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=enabled -Dmesa-clc=enabled -Dvideo-codecs= -Dbuild-tests=false \
            || { tail -60 build/meson-logs/meson-log.txt; exit 1; }
      - name: Build libpan
        run: |
          targets=""
          for v in 4 5 6 7 9 10 12 13 14; do
            targets="$targets src/panfrost/libpan/libpan_v$v.spv src/panfrost/libpan/libpan_v$v.cpp src/panfrost/libpan/libpan_v$v.h"
          done
          ninja -C build $targets
          mkdir -p libpan && cp build/src/panfrost/libpan/libpan_v*.spv build/src/panfrost/libpan/libpan_v*.cpp build/src/panfrost/libpan/libpan_v*.h libpan/
          ls -la libpan
      - uses: actions/upload-artifact@v4
        with:
          name: libpan-generated
          path: libpan/

  panfrost:
    name: d3d10umd + softpipe + Panfrost (ARM64)
    needs: libpan-spirv
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libpan-generated
          path: libpan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$pwd\ci\clc-stubs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBPAN_PREBUILT=$pwd\libpan" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }
      - name: Configure
        shell: pwsh
        run: |
          # clang-cl, not cl: same MSVC ABI (so the D3D runtime and the DLL
          # agree), but it accepts the GNU C Panfrost is written in (?:,
          # statement expressions, case ranges). Bitfield layout is still MSVC's,
          # which mesa-patches/0003 makes irrelevant for the hardware encodings.
          $llvm = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\ARM64\bin'
          $env:CC = Join-Path $llvm 'clang-cl.exe'
          $env:CXX = $env:CC
          & $env:CC --version
          meson setup build mesa --backend=ninja `
            -Dbuildtype=debugoptimized `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-d3d10umd=true `
            -Dmesa-clc=system `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            '-Dc_args=-DHAVE_FUNC_ATTRIBUTE_PACKED' '-Dcpp_args=-DHAVE_FUNC_ATTRIBUTE_PACKED'
          # meson decides clang-cl has no __attribute__((packed)), so PACKED
          # expands to nothing; it does have it, and libpan's kernel argument
          # structs (uint64_t + uint32_t, 12 bytes on the GPU side) need it.
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 80 }; throw 'meson setup failed' }
      - name: Build
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern ' error C| error LNK|fatal error' | Select-Object -First 80 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }

      - name: Smoke test (softpipe, then GALLIUM_DRIVER=panfrost)
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "softpipe smoke test failed ($LASTEXITCODE)" }
          # No Mali on the runner: Panfrost must report no device and hand
          # over to softpipe without crashing, and the triangle still draws.
          $env:GALLIUM_DRIVER = 'panfrost'
          .\triangle.exe $dll 2>&1 | Tee-Object pan.txt
          if ($LASTEXITCODE) { throw "panfrost fallback smoke test failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path pan.txt -Pattern 'Panfrost found no Mali device' -Quiet)) { throw 'Panfrost was not tried' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll, triangle.exe out\

      - name: Panfrost on the emulated driver (MALIKM_FAKE)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # The shim emulates malikm in-process: Panfrost creates its screen,
          # compiles the shaders, builds and submits the job chains; nothing
          # executes them, so the pixels are arbitrary (exit code 2).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          Copy-Item (Get-ChildItem build -Recurse -Filter libgallium_d3d10.pdb | Select-Object -First 1).FullName out\ -ErrorAction SilentlyContinue
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          $cdb = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'arm64' } | Select-Object -First 1).FullName

          # Run with a time limit; on a hang, every thread's stack; on a
          # crash, the faulting stack. stdout and stderr go to files.
          function Run-Triangle($tag) {
            $p = Start-Process -FilePath (Resolve-Path out\triangle.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$tag.out" -RedirectStandardError "$tag.err"
            if (-not $p.WaitForExit(120000)) {
              Write-Host "${tag}: still running after 120 s, dumping threads"
              if ($cdb) { & $cdb -p $p.Id -y "$pwd\out" -c '.lines -e; ~*kn 40; q' 2>&1 | Out-File "$tag-hang.txt" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              return 'hang'
            }
            $code = $p.ExitCode
            Write-Host "${tag}: exit code $code"
            if ($code -lt 0 -and $cdb) {
              & $cdb -g -G -y "$pwd\out" -c '.lines -e; kn 40; r; q' (Resolve-Path out\triangle.exe).Path $dll 2>&1 | Out-File "$tag-crash.txt"
            }
            return $code
          }

          $r = Run-Triangle 'fake'
          Get-Content fake.out, fake.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 40
          if (Test-Path fake-hang.txt) { Get-Content fake-hang.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }
          if (Test-Path fake-crash.txt) { Get-Content fake-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }

          # Same again with pandecode: the job chains Panfrost built on Windows.
          if ($r -eq 0 -or $r -eq 2) {
            New-Item -ItemType Directory -Force trace | Out-Null
            Push-Location trace
            $env:PAN_MESA_DEBUG = 'trace'
            $env:MALIKM_FAKE = '1'
            $p = Start-Process -FilePath (Resolve-Path ..\out\triangle.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                   -RedirectStandardOutput ..\trace.out -RedirectStandardError ..\trace.err
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Host 'trace run hung' }
            Pop-Location
            Get-ChildItem trace | Format-Table Name, Length
          }

          $all = (Get-Content fake.out, fake.err -ErrorAction SilentlyContinue) -join "`n"
          if ($r -eq 'hang') { throw 'triangle.exe hung' }
          if ($all -match 'using softpipe') { throw 'fell back to softpipe' }
          if ($all -notmatch 'malikm-fake: submit') { throw 'no job was submitted' }
          if ($r -ne 0 -and $r -ne 2) { throw "triangle.exe died ($r)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panfrost-fake-trace
          path: |
            fake.*
            fake-*.txt
            trace.*
            trace/

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-arm64
          path: out/

