name: Mesa

# M2: Mesa 26.2 (the last release with the d3d10umd frontend) built natively
# for Windows ARM64, with a D3D11 smoke test run on the runner.

on:
  push:
    paths:
      - '.github/workflows/mesa.yml'
      - 'mesa-patches/**'
      - 'tests/**'
      - 'ci/**'
      - 'win32-compat/**'
      - 'include/**'
      - 'tools/windows/gsso.cpp'
      - 'tools/windows/emucheck.cpp'
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_TAG: mesa-26.2.0
  # gitlab.freedesktop.org was returning 502/504 when this was written; the
  # GitHub mirror carries the same tags.
  MESA_URL: https://github.com/chaotic-cx/mesa-mirror.git

jobs:
  softpipe:
    name: d3d10umd + softpipe (ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          # flex/bison: x64 binaries, run under emulation on ARM64 Windows.
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }

      - name: Configure
        shell: pwsh
        run: |
          meson setup build mesa --backend=ninja `
            -Dbuildtype=release `
            -Dplatforms=windows `
            -Dgallium-drivers=softpipe `
            -Dgallium-d3d10umd=true `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false
          if ($LASTEXITCODE) { Get-Content build\meson-logs\meson-log.txt -Tail 80; throw 'meson setup failed' }

      - name: Build
        shell: pwsh
        run: |
          meson compile -C build
          if ($LASTEXITCODE) { throw 'build failed' }
          Get-ChildItem build -Recurse -Filter *.dll | Format-Table FullName, Length

      - name: D3D11 smoke test
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "smoke test failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force out | Out-Null
          cl /nologo /EHsc /O2 /MD tests\d3d11-present\present.cpp /Fe:present.exe
          if ($LASTEXITCODE) { throw 'present build failed' }
          .\present.exe $dll
          if ($LASTEXITCODE) { throw "softpipe present test failed ($LASTEXITCODE)" }
          # Geometry shaders and stream output: softpipe has them; with
          # D3D10UMD_NO_GS=1 the frontend takes the path it takes on Panfrost
          # (every create fails, nothing after that crashes).
          cl /nologo /EHsc /O2 /MD tools\windows\gsso.cpp /Fe:gsso.exe
          if ($LASTEXITCODE) { throw 'gsso build failed' }
          # 4b, a GS that indexes its input vertices by a loop counter, hangs
          # in softpipe (CI run 43408698585: "FAIL 4b hung"); left out here
          # so the steps after it still run.
          $env:GSSO_SKIP = '4b'
          .\gsso.exe $dll gs
          if ($LASTEXITCODE) { throw "gsso on softpipe failed ($LASTEXITCODE)" }
          Remove-Item Env:GSSO_SKIP
          $env:D3D10UMD_NO_GS = '1'
          .\gsso.exe $dll nogs
          if ($LASTEXITCODE) { throw "gsso on softpipe without geometry shaders failed ($LASTEXITCODE)" }
          Remove-Item Env:D3D10UMD_NO_GS
          Copy-Item $dll, triangle.exe, present.exe, gsso.exe out\

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-softpipe-arm64
          path: out/

  libpan-spirv:
    # Panfrost precompiles a few OpenCL C kernels (libpan). mesa_clc needs
    # LLVM and clang, which the Windows build avoids: generate the SPIR-V and
    # vtn_bindgen2's C++ here (both platform independent) and hand them over.
    name: libpan SPIR-V (Linux, LLVM)
    runs-on: ubuntu-24.04
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev \
            libllvmspirvlib-18-dev spirv-tools glslang-tools libdrm-dev \
            python3-mako python3-yaml python3-packaging bison flex pkg-config \
            libexpat1-dev zlib1g-dev ninja-build
          python3 -m pip install --break-system-packages meson
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Mesa source
        run: |
          git clone --depth 1 --branch "$MESA_TAG" "$MESA_URL" mesa
          for p in repo/mesa-patches/*.patch; do echo "applying $p"; git -C mesa apply --whitespace=nowarn "$PWD/$p"; done
      - name: Bifrost packing equals GCC's layout
        run: |
          # mesa-patches/0003 replaces memcpy-of-bitfield-struct with explicit
          # packing so MSVC builds encode instructions correctly. Prove the two
          # agree where GCC's layout is still the reference.
          gcc -O1 -w -DHAVE_FUNC_ATTRIBUTE_PACKED -Imesa/src -Imesa/include \
            -Imesa/src/panfrost/compiler/bifrost repo/tests/bifrost-pack/check.c -o bpcheck
          ./bpcheck
      - name: Configure
        run: |
          meson setup build mesa -Dbuildtype=release \
            -Dgallium-drivers=panfrost -Dvulkan-drivers= -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=enabled -Dmesa-clc=enabled -Dvideo-codecs= -Dbuild-tests=false \
            || { tail -60 build/meson-logs/meson-log.txt; exit 1; }
      - name: Build libpan
        run: |
          targets=""
          for v in 4 5 6 7 9 10 12 13 14; do
            targets="$targets src/panfrost/libpan/libpan_v$v.spv src/panfrost/libpan/libpan_v$v.cpp src/panfrost/libpan/libpan_v$v.h"
          done
          ninja -C build $targets
          mkdir -p libpan && cp build/src/panfrost/libpan/libpan_v*.spv build/src/panfrost/libpan/libpan_v*.cpp build/src/panfrost/libpan/libpan_v*.h libpan/
          ls -la libpan
      - uses: actions/upload-artifact@v4
        with:
          name: libpan-generated
          path: libpan/

  panfrost:
    name: d3d10umd + softpipe + Panfrost (ARM64)
    needs: libpan-spirv
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libpan-generated
          path: libpan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$pwd\ci\clc-stubs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBPAN_PREBUILT=$pwd\libpan" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Copy-Item include\maliwddm_abi.h mesa\include\win32-compat\
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }
      - name: Configure
        shell: pwsh
        run: |
          # clang-cl, not cl: same MSVC ABI (so the D3D runtime and the DLL
          # agree), but it accepts the GNU C Panfrost is written in (?:,
          # statement expressions, case ranges). Bitfield layout is still MSVC's,
          # which mesa-patches/0003 makes irrelevant for the hardware encodings.
          $llvm = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\ARM64\bin'
          $env:CC = Join-Path $llvm 'clang-cl.exe'
          $env:CXX = $env:CC
          & $env:CC --version
          meson setup build mesa --backend=ninja `
            -Dbuildtype=debugoptimized `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-d3d10umd=true `
            -Dmesa-clc=system `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            '-Dc_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert' '-Dcpp_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert'
          # meson decides clang-cl has no __attribute__((packed)), so PACKED
          # expands to nothing; it does have it, and libpan's kernel argument
          # structs (uint64_t + uint32_t, 12 bytes on the GPU side) need it.
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 80 }; throw 'meson setup failed' }
      - name: Build
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern ' error C| error LNK|fatal error' | Select-Object -First 80 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }

      - name: Smoke test (softpipe, then GALLIUM_DRIVER=panfrost)
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-present\present.cpp /Fe:present.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          cl /nologo /EHsc /O2 /MD tools\windows\gsso.cpp /Fe:gsso.exe
          if ($LASTEXITCODE) { throw 'gsso build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "softpipe smoke test failed ($LASTEXITCODE)" }
          # No Mali on the runner: Panfrost must report no device and hand
          # over to softpipe without crashing, and the triangle still draws.
          $env:GALLIUM_DRIVER = 'panfrost'
          .\triangle.exe $dll 2>&1 | Tee-Object pan.txt
          if ($LASTEXITCODE) { throw "panfrost fallback smoke test failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path pan.txt -Pattern 'Panfrost found no Mali device' -Quiet)) { throw 'Panfrost was not tried' }
          New-Item -ItemType Directory -Force out | Out-Null
          .\present.exe $dll
          if ($LASTEXITCODE) { throw "softpipe present test failed ($LASTEXITCODE)" }
          Copy-Item $dll, triangle.exe, present.exe, gsso.exe out\

      - name: Panfrost on the emulated driver (MALIKM_FAKE)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # The shim emulates malikm in-process: Panfrost creates its screen,
          # compiles the shaders, builds and submits the job chains; nothing
          # executes them, so the pixels are arbitrary (exit code 2).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          Copy-Item (Get-ChildItem build -Recurse -Filter libgallium_d3d10.pdb | Select-Object -First 1).FullName out\ -ErrorAction SilentlyContinue
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          $cdb = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'arm64' } | Select-Object -First 1).FullName

          # Run with a time limit; on a hang, every thread's stack; on a
          # crash, the faulting stack. stdout and stderr go to files.
          function Run-Triangle($tag, $exe = 'triangle.exe', $extra = '') {
            $p = Start-Process -FilePath (Resolve-Path out\$exe).Path -ArgumentList "`"$dll`" $extra" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$tag.out" -RedirectStandardError "$tag.err"
            if (-not $p.WaitForExit(120000)) {
              Write-Host "${tag}: still running after 120 s, dumping threads"
              if ($cdb) { & $cdb -p $p.Id -y "$pwd\out" -c '.lines -e; ~*kn 40; q' 2>&1 | Out-File "$tag-hang.txt" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              return 'hang'
            }
            $code = $p.ExitCode
            Write-Host "${tag}: exit code $code"
            if ($code -lt 0 -and $cdb) {
              & $cdb -g -G -y "$pwd\out" -c '.lines -e; kn 40; r; q' (Resolve-Path out\$exe).Path $dll 2>&1 | Out-File "$tag-crash.txt"
            }
            return $code
          }

          $r = Run-Triangle 'fake'
          Get-Content fake.out, fake.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 40
          if (Test-Path fake-hang.txt) { Get-Content fake-hang.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }
          if (Test-Path fake-crash.txt) { Get-Content fake-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }

          # Same again with pandecode: the job chains Panfrost built on Windows.
          if ($r -eq 0 -or $r -eq 2) {
            New-Item -ItemType Directory -Force trace | Out-Null
            Push-Location trace
            $env:PAN_MESA_DEBUG = 'trace'
            $env:MALIKM_FAKE = '1'
            $p = Start-Process -FilePath (Resolve-Path ..\out\triangle.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                   -RedirectStandardOutput ..\trace.out -RedirectStandardError ..\trace.err
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Host 'trace run hung' }
            Pop-Location
            Get-ChildItem trace | Format-Table Name, Length
          }

          # Present through the Panfrost GDI path (mesa-patches/0014).
          $pr = Run-Triangle 'present' 'present.exe'
          Get-Content present.out, present.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 20
          if (Test-Path present-crash.txt) { Get-Content present-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }
          if (Test-Path present-hang.txt) { Get-Content present-hang.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }

          # Geometry shaders and stream output on Panfrost, which has
          # neither: the three creates fail with E_OUTOFMEMORY and every step
          # after them returns. Nothing executes the jobs, so the pixel
          # checks are arbitrary; only the create lines and "done" count.
          $gr = Run-Triangle 'gsso' 'gsso.exe' 'nogs'
          Get-Content gsso.out, gsso.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 30
          if (Test-Path gsso-crash.txt) { Get-Content gsso-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }
          if (Test-Path gsso-hang.txt) { Get-Content gsso-hang.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }
          $gout = (Get-Content gsso.out -ErrorAction SilentlyContinue) -join "`n"

          $all = (Get-Content fake.out, fake.err -ErrorAction SilentlyContinue) -join "`n"
          if ($r -eq 'hang') { throw 'triangle.exe hung' }
          if ($all -match 'using softpipe') { throw 'fell back to softpipe' }
          if ($all -notmatch 'malikm-fake: submit') { throw 'no job was submitted' }
          if ($r -ne 0 -and $r -ne 2) { throw "triangle.exe died ($r)" }
          if ($pr -ne 0) { throw "present.exe failed ($pr)" }
          if ($gr -eq 'hang') { throw 'gsso.exe hung' }
          if ($gout -notmatch '(?m)^done') { throw "gsso.exe did not finish ($gr)" }
          foreach ($n in 1, 2, 3) {
            if ($gout -notmatch "(?m)^UNSUPPORTED +$n ") { throw "gsso.exe step $n was not UNSUPPORTED on Panfrost" }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panfrost-fake-trace
          path: |
            fake.*
            fake-*.txt
            present.*
            present-*.txt
            gsso.*
            gsso-*.txt
            trace.*
            trace/

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-arm64
          path: out/


  panfrost-emulated:
    # The same UMD for the processes Windows on Arm emulates: x64 (loaded
    # through the ARM64X forwarder below) and x86 (UserModeDriverNameWow,
    # SysWOW64). Built and smoke-tested natively on an x64 runner; Panfrost's
    # own code then runs emulated on the board. windows-2022, as the
    # driver build in ci.yml: its image has the WDK, whose UMD DDI headers
    # (d3dumddi.h, d3d10umddi.h) d3d10umd needs.
    name: d3d10umd + softpipe + Panfrost (${{ matrix.arch }})
    needs: libpan-spirv
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcvars: x64
          - arch: x86
            vcvars: amd64_x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libpan-generated
          path: libpan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$pwd\ci\clc-stubs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBPAN_PREBUILT=$pwd\libpan" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Copy-Item include\maliwddm_abi.h mesa\include\win32-compat\
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }
      - name: Configure
        shell: pwsh
        run: |
          # clang-cl as on ARM64. For x86, -m32 through _CL_, which clang-cl
          # reads from the environment as cl does, with /arch:SSE2 as cl's
          # default is (plain -m32 is an i386 with no cmpxchg8b, whose 64-bit
          # atomics are calls into a libatomic Windows has not got), and a
          # cross file that says
          # the host is x86 (with -m32 in the compiler list, meson passed it
          # to rc too and still took the host for x86_64; under a name that
          # starts with the triple, meson did not know it for clang-cl). It
          # runs on this x64 runner, so no exe wrapper.
          # The C runtime is linked in (/MT): the board has no x64 or x86
          # vcruntime140.dll to count on, and the UMD must load without one.
          $cc = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin\clang-cl.exe'
          $c = $cc -replace '\\', '/'
          if ('${{ matrix.arch }}' -eq 'x86') {
            $env:_CL_ = '-m32 /arch:SSE2'
            "_CL_=-m32 /arch:SSE2" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Set-Content -Encoding ascii cross.ini ("[binaries]`nc = '$c'`ncpp = '$c'`n" +
              "[properties]`nneeds_exe_wrapper = false`n" +
              "[host_machine]`nsystem = 'windows'`ncpu_family = 'x86'`ncpu = 'i686'`nendian = 'little'`n")
            Get-Content cross.ini
            $mfile = @('--cross-file', 'cross.ini')
          } else {
            Set-Content -Encoding ascii native.ini "[binaries]`nc = '$c'`ncpp = '$c'`n"
            $mfile = @('--native-file', 'native.ini')
          }
          & $cc --version
          meson setup build mesa --backend=ninja @mfile `
            -Dbuildtype=debugoptimized -Db_vscrt=mt `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-d3d10umd=true `
            -Dmesa-clc=system `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            '-Dc_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert' '-Dcpp_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert'
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 80 }; throw 'meson setup failed' }
          Select-String -Path build\meson-logs\meson-log.txt -Pattern 'Host machine cpu|Build machine cpu' | ForEach-Object { $_.Line }
      - name: Build
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern ' error C| error LNK|fatal error|error:' | Select-Object -First 80 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          dumpbin /nologo /headers $dll | Select-String 'machine' | Select-Object -First 2 | ForEach-Object { $_.Line }
          dumpbin /nologo /exports $dll | Select-String 'OpenAdapter' | ForEach-Object { $_.Line }

      - name: Smoke test (softpipe, then GALLIUM_DRIVER=panfrost)
        shell: pwsh
        run: |
          Remove-Item Env:_CL_ -ErrorAction SilentlyContinue
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          cl /nologo /EHsc /O2 /MT tools\windows\emucheck.cpp /Fe:emucheck.exe
          if ($LASTEXITCODE) { throw 'emucheck build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "softpipe smoke test failed ($LASTEXITCODE)" }
          .\emucheck.exe sw $dll
          if ($LASTEXITCODE) { throw "emucheck on the DLL failed ($LASTEXITCODE)" }
          $env:GALLIUM_DRIVER = 'panfrost'
          .\triangle.exe $dll 2>&1 | Tee-Object pan.txt
          if ($LASTEXITCODE) { throw "panfrost fallback smoke test failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path pan.txt -Pattern 'Panfrost found no Mali device' -Quiet)) { throw 'Panfrost was not tried' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll, triangle.exe, emucheck.exe out\
          Copy-Item (Get-ChildItem build -Recurse -Filter libgallium_d3d10.pdb | Select-Object -First 1).FullName out\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-${{ matrix.arch }}
          path: out/

      - name: Panfrost on the emulated driver (MALIKM_FAKE)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # As on ARM64: Panfrost compiles the shaders and builds and submits
          # job chains to the shim's in-process stand-in for the kernel
          # driver. Here it is the x64 or x86 Panfrost doing it, pointers of
          # that size included; nothing executes the jobs (exit code 2 is
          # fine, the pixels are arbitrary).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          $p = Start-Process -FilePath (Resolve-Path out\triangle.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                 -RedirectStandardOutput fake.out -RedirectStandardError fake.err
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw 'triangle.exe hung' }
          $r = $p.ExitCode
          Get-Content fake.out, fake.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 40
          $all = (Get-Content fake.out, fake.err -ErrorAction SilentlyContinue) -join "`n"
          Write-Host "triangle.exe exit code $r"
          if ($all -match 'using softpipe') { throw 'fell back to softpipe' }
          if ($all -notmatch 'malikm-fake: submit') { throw 'no job was submitted' }
          if ($r -ne 0 -and $r -ne 2) { throw "triangle.exe died ($r)" }

  arm64x-forwarder:
    # maliumd.dll as an ARM64X pure forwarder (learn.microsoft.com/windows/
    # arm/arm64x-build): no code, two export tables. An ARM64 process that
    # loads it gets maliumd_arm64.dll in its place; an x64 process (or an
    # ARM64EC one) is sent to maliumd_x64.dll. The D3D runtime loads the
    # name in UserModeDriverName into both kinds of process, so the file it
    # names must be ARM64X; the forwarder makes it one without building Mesa
    # as ARM64EC.
    name: maliumd.dll, ARM64X forwarder
    needs: [panfrost, panfrost-emulated]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-arm64
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-x64
          path: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Link the forwarder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force fw, out | Out-Null
          # Forward every export the DLLs have: the runtime needs
          # OpenAdapter10 and OpenAdapter10_2 from a hardware UMD, and the
          # D3DKMT* ones from a software one (the CI test below).
          function Exports($dll) {
            dumpbin /nologo /exports $dll | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] }
            }
          }
          $ea = @(Exports arm64\libgallium_d3d10.dll)
          $ex = @(Exports x64\libgallium_d3d10.dll)
          Write-Host "exports: ARM64 $($ea.Count), x64 $($ex.Count)"
          if (-not ($ea -contains 'OpenAdapter10_2') -or -not ($ex -contains 'OpenAdapter10_2')) { throw 'OpenAdapter10_2 is not exported' }
          ("EXPORTS`n" + (($ea | ForEach-Object { "    $_ = maliumd_arm64.$_" }) -join "`n")) | Set-Content -Encoding ascii fw\maliumd_arm64.def
          ("EXPORTS`n" + (($ex | ForEach-Object { "    $_ = maliumd_x64.$_" }) -join "`n")) | Set-Content -Encoding ascii fw\maliumd_x64.def
          Set-Content -Encoding ascii fw\empty.cpp ''
          Push-Location fw
          cl /nologo /c /Foempty_arm64.obj empty.cpp
          if ($LASTEXITCODE) { throw 'cl (ARM64) failed' }
          cl /nologo /c /arm64EC /Foempty_x64.obj empty.cpp
          if ($LASTEXITCODE) { throw 'cl (ARM64EC) failed' }
          link /nologo /lib /machine:x64 /def:maliumd_x64.def /out:maliumd_x64.lib
          if ($LASTEXITCODE) { throw 'lib (x64) failed' }
          link /nologo /lib /machine:arm64 /def:maliumd_arm64.def /out:maliumd_arm64.lib
          if ($LASTEXITCODE) { throw 'lib (ARM64) failed' }
          link /nologo /dll /noentry /machine:arm64x /defArm64Native:maliumd_arm64.def /def:maliumd_x64.def `
            empty_arm64.obj empty_x64.obj /out:maliumd.dll maliumd_arm64.lib maliumd_x64.lib
          if ($LASTEXITCODE) { throw 'link (ARM64X) failed' }
          dumpbin /nologo /headers maliumd.dll | Select-String 'machine' | ForEach-Object { $_.Line }
          Pop-Location
          Copy-Item fw\maliumd.dll, fw\maliumd_arm64.def, fw\maliumd_x64.def out\
          Copy-Item arm64\libgallium_d3d10.dll out\maliumd_arm64.dll
          Copy-Item x64\libgallium_d3d10.dll out\maliumd_x64.dll

      - name: Load it from an ARM64 and an x64 process
        shell: pwsh
        run: |
          # A software device on the forwarder from both kinds of process:
          # the ARM64 one must end up in maliumd_arm64.dll, the x64 one
          # (emulated on this runner) in maliumd_x64.dll, and both draw.
          New-Item -ItemType Directory -Force t | Out-Null
          Copy-Item out\maliumd.dll, out\maliumd_arm64.dll, out\maliumd_x64.dll t\
          cl /nologo /EHsc /O2 /MD tools\windows\emucheck.cpp /Fe:t\emucheck-arm64.exe
          if ($LASTEXITCODE) { throw 'emucheck (ARM64) build failed' }
          Copy-Item x64\emucheck.exe t\emucheck-x64.exe
          $fwd = (Resolve-Path t\maliumd.dll).Path
          foreach ($n in 'arm64', 'x64') {
            Write-Host "== $n process"
            & ".\t\emucheck-$n.exe" sw $fwd 2>&1 | Tee-Object "t\$n.txt"
            $code = $LASTEXITCODE
            if ($code) { throw "emucheck-$n through the forwarder failed ($code)" }
            if (-not (Select-String -Path "t\$n.txt" -Pattern "maliumd_$n.dll" -Quiet)) { throw "the $n process did not load maliumd_$n.dll" }
          }
          Copy-Item t\arm64.txt, t\x64.txt out\

      - uses: actions/upload-artifact@v4
        with:
          name: maliumd-arm64x
          path: out/
