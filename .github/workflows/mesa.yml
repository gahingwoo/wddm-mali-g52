name: Mesa

# M2: Mesa 26.2 (the last release with the d3d10umd frontend) built natively
# for Windows ARM64, with a D3D11 smoke test run on the runner.

on:
  push:
    paths:
      - '.github/workflows/mesa.yml'
      - 'mesa-patches/**'
      - 'tests/**'
      - 'ci/**'
      - 'win32-compat/**'
      - 'include/**'
      - 'tools/windows/gsso.cpp'
      - 'tools/windows/emucheck.cpp'
      - 'tools/windows/gltri.cpp'
      - 'tools/windows/copytest.cpp'
      - 'tools/windows/vkprobe.cpp'
      - 'tools/windows/fl11test.cpp'
      - 'tools/windows/vdectest/**'
      - 'video/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_TAG: mesa-26.2.0
  # gitlab.freedesktop.org was returning 502/504 when this was written; the
  # GitHub mirror carries the same tags.
  MESA_URL: https://github.com/chaotic-cx/mesa-mirror.git

jobs:
  softpipe:
    name: d3d10umd + softpipe (ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          # flex/bison: x64 binaries, run under emulation on ARM64 Windows.
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          # The video decoder backend and the VDPU383 register builder (0078).
          Copy-Item -Recurse video mesa\src\gallium\frontends\d3d10umd\video
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }

      - name: Configure
        shell: pwsh
        run: |
          meson setup build mesa --backend=ninja `
            -Dbuildtype=release `
            -Dplatforms=windows `
            -Dgallium-drivers=softpipe `
            -Dgallium-d3d10umd=true `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false
          if ($LASTEXITCODE) { Get-Content build\meson-logs\meson-log.txt -Tail 80; throw 'meson setup failed' }

      - name: Build
        shell: pwsh
        run: |
          meson compile -C build
          if ($LASTEXITCODE) { throw 'build failed' }
          Get-ChildItem build -Recurse -Filter *.dll | Format-Table FullName, Length

      - name: D3D11 smoke test
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "smoke test failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force out | Out-Null
          cl /nologo /EHsc /O2 /MD tests\d3d11-present\present.cpp /Fe:present.exe
          if ($LASTEXITCODE) { throw 'present build failed' }
          .\present.exe $dll
          if ($LASTEXITCODE) { throw "softpipe present test failed ($LASTEXITCODE)" }
          # Geometry shaders and stream output: softpipe has them; with
          # D3D10UMD_NO_GS=1 the frontend takes the path it takes on Panfrost
          # (every create fails, nothing after that crashes).
          cl /nologo /EHsc /O2 /MD tools\windows\gsso.cpp /Fe:gsso.exe
          if ($LASTEXITCODE) { throw 'gsso build failed' }
          # 4b, a GS that indexes its input vertices by a loop counter, hangs
          # in softpipe (CI run 43408698585: "FAIL 4b hung"); left out here
          # so the steps after it still run.
          $env:GSSO_SKIP = '4b'
          .\gsso.exe $dll gs
          if ($LASTEXITCODE) { throw "gsso on softpipe failed ($LASTEXITCODE)" }
          Remove-Item Env:GSSO_SKIP
          $env:D3D10UMD_NO_GS = '1'
          .\gsso.exe $dll nogs
          if ($LASTEXITCODE) { throw "gsso on softpipe without geometry shaders failed ($LASTEXITCODE)" }
          Remove-Item Env:D3D10UMD_NO_GS
          Copy-Item $dll, triangle.exe, present.exe, gsso.exe out\

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-softpipe-arm64
          path: out/

  libpan-spirv:
    # Panfrost precompiles a few OpenCL C kernels (libpan). mesa_clc needs
    # LLVM and clang, which the Windows build avoids: generate the SPIR-V and
    # vtn_bindgen2's C++ here (both platform independent) and hand them over.
    name: libpan SPIR-V (Linux, LLVM)
    runs-on: ubuntu-24.04
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev \
            libllvmspirvlib-18-dev spirv-tools glslang-tools libdrm-dev \
            python3-mako python3-yaml python3-packaging bison flex pkg-config \
            libexpat1-dev zlib1g-dev ninja-build
          python3 -m pip install --break-system-packages meson
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Mesa source
        run: |
          git clone --depth 1 --branch "$MESA_TAG" "$MESA_URL" mesa
          for p in repo/mesa-patches/*.patch; do echo "applying $p"; git -C mesa apply --whitespace=nowarn "$PWD/$p"; done
      - name: Bifrost packing equals GCC's layout
        run: |
          # mesa-patches/0003 replaces memcpy-of-bitfield-struct with explicit
          # packing so MSVC builds encode instructions correctly. Prove the two
          # agree where GCC's layout is still the reference.
          gcc -O1 -w -DHAVE_FUNC_ATTRIBUTE_PACKED -Imesa/src -Imesa/include \
            -Imesa/src/panfrost/compiler/bifrost repo/tests/bifrost-pack/check.c -o bpcheck
          ./bpcheck
      - name: Configure
        run: |
          meson setup build mesa -Dbuildtype=release \
            -Dgallium-drivers=panfrost -Dvulkan-drivers= -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=enabled -Dmesa-clc=enabled -Dvideo-codecs= -Dbuild-tests=false \
            || { tail -60 build/meson-logs/meson-log.txt; exit 1; }
      - name: Build libpan
        run: |
          targets=""
          for v in 4 5 6 7 9 10 12 13 14; do
            targets="$targets src/panfrost/libpan/libpan_v$v.spv src/panfrost/libpan/libpan_v$v.cpp src/panfrost/libpan/libpan_v$v.h"
          done
          ninja -C build $targets
          mkdir -p libpan && cp build/src/panfrost/libpan/libpan_v*.spv build/src/panfrost/libpan/libpan_v*.cpp build/src/panfrost/libpan/libpan_v*.h libpan/
          ls -la libpan
      - uses: actions/upload-artifact@v4
        with:
          name: libpan-generated
          path: libpan/

  panfrost:
    name: d3d10umd + softpipe + Panfrost (ARM64)
    needs: libpan-spirv
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libpan-generated
          path: libpan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$pwd\ci\clc-stubs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBPAN_PREBUILT=$pwd\libpan" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          # The video decoder backend and the VDPU383 register builder (0078).
          Copy-Item -Recurse video mesa\src\gallium\frontends\d3d10umd\video
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Copy-Item include\maliwddm_abi.h mesa\include\win32-compat\
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }
      - name: Configure
        shell: pwsh
        run: |
          # clang-cl, not cl: same MSVC ABI (so the D3D runtime and the DLL
          # agree), but it accepts the GNU C Panfrost is written in (?:,
          # statement expressions, case ranges). Bitfield layout is still MSVC's,
          # which mesa-patches/0003 makes irrelevant for the hardware encodings.
          $llvm = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\ARM64\bin'
          $env:CC = Join-Path $llvm 'clang-cl.exe'
          $env:CXX = $env:CC
          & $env:CC --version
          meson setup build mesa --backend=ninja `
            -Dbuildtype=debugoptimized `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-d3d10umd=true `
            -Dmesa-clc=system `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            '-Dc_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert' '-Dcpp_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert'
          # meson decides clang-cl has no __attribute__((packed)), so PACKED
          # expands to nothing; it does have it, and libpan's kernel argument
          # structs (uint64_t + uint32_t, 12 bytes on the GPU side) need it.
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 80 }; throw 'meson setup failed' }
      - name: Build
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern ' error C| error LNK|fatal error' | Select-Object -First 80 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }

      - name: Smoke test (softpipe, then GALLIUM_DRIVER=panfrost)
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-present\present.cpp /Fe:present.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          cl /nologo /EHsc /O2 /MD tools\windows\gsso.cpp /Fe:gsso.exe
          if ($LASTEXITCODE) { throw 'gsso build failed' }
          cl /nologo /EHsc /O2 /MD tools\windows\copytest.cpp /Fe:copytest.exe
          if ($LASTEXITCODE) { throw 'copytest build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "softpipe smoke test failed ($LASTEXITCODE)" }
          # The copy orders of mesa-patches/0075 on a driver that runs them:
          # the expected pixels are right (the same program checks the Mali).
          .\copytest.exe $dll
          if ($LASTEXITCODE) { throw "copytest on softpipe failed ($LASTEXITCODE)" }
          # A draw with no input layout ever set (mesa-patches/0070).
          .\triangle.exe $dll nolayout
          if ($LASTEXITCODE) { throw "softpipe draw without an input layout failed ($LASTEXITCODE)" }
          # No Mali on the runner: Panfrost must report no device and hand
          # over to softpipe without crashing, and the triangle still draws.
          $env:GALLIUM_DRIVER = 'panfrost'
          .\triangle.exe $dll 2>&1 | Tee-Object pan.txt
          if ($LASTEXITCODE) { throw "panfrost fallback smoke test failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path pan.txt -Pattern 'Panfrost found no Mali device' -Quiet)) { throw 'Panfrost was not tried' }
          New-Item -ItemType Directory -Force out | Out-Null
          .\present.exe $dll
          if ($LASTEXITCODE) { throw "softpipe present test failed ($LASTEXITCODE)" }
          Copy-Item $dll, triangle.exe, present.exe, gsso.exe, copytest.exe out\

      - name: Panfrost on the emulated driver (MALIKM_FAKE)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # The shim emulates malikm in-process: Panfrost creates its screen,
          # compiles the shaders, builds and submits the job chains; nothing
          # executes them, so the pixels are arbitrary (exit code 2).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          Copy-Item (Get-ChildItem build -Recurse -Filter libgallium_d3d10.pdb | Select-Object -First 1).FullName out\ -ErrorAction SilentlyContinue
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          $cdb = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'arm64' } | Select-Object -First 1).FullName

          # Run with a time limit; on a hang, every thread's stack; on a
          # crash, the faulting stack. stdout and stderr go to files.
          function Run-Triangle($tag, $exe = 'triangle.exe', $extra = '') {
            $p = Start-Process -FilePath (Resolve-Path out\$exe).Path -ArgumentList "`"$dll`" $extra" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$tag.out" -RedirectStandardError "$tag.err"
            if (-not $p.WaitForExit(120000)) {
              Write-Host "${tag}: still running after 120 s, dumping threads"
              if ($cdb) { & $cdb -p $p.Id -y "$pwd\out" -c '.lines -e; ~*kn 40; q' 2>&1 | Out-File "$tag-hang.txt" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              return 'hang'
            }
            $code = $p.ExitCode
            Write-Host "${tag}: exit code $code"
            if ($code -lt 0 -and $cdb) {
              & $cdb -g -G -y "$pwd\out" -c '.lines -e; kn 40; r; q' (Resolve-Path out\$exe).Path $dll 2>&1 | Out-File "$tag-crash.txt"
            }
            return $code
          }

          $r = Run-Triangle 'fake'
          Get-Content fake.out, fake.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 40
          if (Test-Path fake-hang.txt) { Get-Content fake-hang.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }
          if (Test-Path fake-crash.txt) { Get-Content fake-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }

          # Same again with pandecode: the job chains Panfrost built on Windows.
          if ($r -eq 0 -or $r -eq 2) {
            New-Item -ItemType Directory -Force trace | Out-Null
            Push-Location trace
            $env:PAN_MESA_DEBUG = 'trace'
            $env:MALIKM_FAKE = '1'
            $p = Start-Process -FilePath (Resolve-Path ..\out\triangle.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                   -RedirectStandardOutput ..\trace.out -RedirectStandardError ..\trace.err
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Host 'trace run hung' }
            Pop-Location
            Get-ChildItem trace | Format-Table Name, Length
          }

          # Present through the Panfrost GDI path (mesa-patches/0014).
          $pr = Run-Triangle 'present' 'present.exe'
          Get-Content present.out, present.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 20
          if (Test-Path present-crash.txt) { Get-Content present-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }
          if (Test-Path present-hang.txt) { Get-Content present-hang.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }

          # Geometry shaders and stream output on Panfrost, which has
          # neither: the three creates fail with E_OUTOFMEMORY and every step
          # after them returns. Nothing executes the jobs, so the pixel
          # checks are arbitrary; only the create lines and "done" count.
          $gr = Run-Triangle 'gsso' 'gsso.exe' 'nogs'
          Get-Content gsso.out, gsso.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 30
          if (Test-Path gsso-crash.txt) { Get-Content gsso-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }
          if (Test-Path gsso-hang.txt) { Get-Content gsso-hang.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }
          $gout = (Get-Content gsso.out -ErrorAction SilentlyContinue) -join "`n"

          # A draw with no input layout and no vertex buffer ever set on the
          # device: the D3D11 runtime's clear of part of a DComp surface.
          # Panfrost read a NULL vertex elements state there (+0x344) and
          # the process died (mesa-patches/0070). Pixels are arbitrary.
          $nl = Run-Triangle 'nolayout' 'triangle.exe' 'nolayout'
          Get-Content nolayout.out, nolayout.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 10
          if (Test-Path nolayout-crash.txt) { Get-Content nolayout-crash.txt | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }

          # GPU copies with and without the open batches (mesa-patches/0075):
          # Panfrost records and submits them; nothing runs the jobs, so the
          # pixels are only reported (nocheck).
          $cr = @{}
          foreach ($cb in '0', '1') {
            $env:D3D10UMD_COPYBATCH = $cb
            $cr[$cb] = Run-Triangle "copy$cb" 'copytest.exe' 'nocheck'
            Get-Content "copy$cb.out", "copy$cb.err" -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 14
            if (Test-Path "copy$cb-crash.txt") { Get-Content "copy$cb-crash.txt" | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 60 }
            if (Test-Path "copy$cb-hang.txt") { Get-Content "copy$cb-hang.txt" | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 150 }
          }
          Remove-Item Env:D3D10UMD_COPYBATCH
          foreach ($cb in '0', '1') {
            if ($cr[$cb] -ne 0) { throw "copytest.exe with D3D10UMD_COPYBATCH=$cb failed ($($cr[$cb]))" }
            if (-not (Select-String -Path "copy$cb.out" -Pattern '^done' -Quiet)) { throw "copytest.exe with D3D10UMD_COPYBATCH=$cb did not finish" }
          }

          $all = (Get-Content fake.out, fake.err -ErrorAction SilentlyContinue) -join "`n"
          if ($nl -eq 'hang') { throw 'triangle.exe nolayout hung' }
          if ($nl -ne 0 -and $nl -ne 2) { throw "triangle.exe nolayout died ($nl): a draw without an input layout" }
          if ($r -eq 'hang') { throw 'triangle.exe hung' }
          if ($all -match 'using softpipe') { throw 'fell back to softpipe' }
          if ($all -notmatch 'malikm-fake: submit') { throw 'no job was submitted' }
          if ($r -ne 0 -and $r -ne 2) { throw "triangle.exe died ($r)" }
          if ($pr -ne 0) { throw "present.exe failed ($pr)" }
          if ($gr -eq 'hang') { throw 'gsso.exe hung' }
          if ($gout -notmatch '(?m)^done') { throw "gsso.exe did not finish ($gr)" }
          foreach ($n in 1, 2, 3) {
            if ($gout -notmatch "(?m)^UNSUPPORTED +$n ") { throw "gsso.exe step $n was not UNSUPPORTED on Panfrost" }
          }

      - name: D3D11 video decode through the D3D11.1 interface (vdectest, fake decoder)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # 0078: UmdVideo gives the processes it names the D3D11.1
          # interface and ID3D11VideoDevice; D3D10UMD_UMDVIDEO stands in for
          # the Device Parameters value without a KMD, D3D10UMD_VDEC_FAKE for
          # the decoder (vdec.c builds the register file, then writes a
          # pattern vdectest checks after the copy to a staging texture).
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          New-Item -ItemType Directory -Force vt | Out-Null
          cl /nologo /W3 /O2 /EHsc /MD /Itools\windows\vdectest tools\windows\vdectest\vdectest.cpp `
             tools\windows\vdectest\vptest.cpp tools\windows\vdectest\chromeprobe.cpp tools\windows\vdectest\mfprobe.cpp `
             tools\windows\vdectest\codecs.cpp tools\windows\vdectest\h264parse.c `
             tools\windows\vdectest\hevcparse.c tools\windows\vdectest\vp9parse.c `
             tools\windows\vdectest\av1parse.c `
             video\vdpu383\lib\vdpu383_hevc.c video\vdpu383\lib\vdpu383_hevc_cabac.c `
             video\vdpu383\lib\vdpu383_vp9.c video\vdpu383\lib\vdpu383_vp9_probs.c `
             video\vdpu383\lib\vdpu383_av1.c video\vdpu383\lib\vdpu383_av1_cdf.c `
             tools\windows\vdectest\md5.c /Fe:vt\vdectest.exe
          if ($LASTEXITCODE) { throw 'vdectest build failed' }
          Copy-Item vt\vdectest.exe vt\notaplayer.exe
          Copy-Item out\triangle.exe vt\mpv.exe
          Copy-Item out\present.exe vt\ffplay.exe
          $env:GALLIUM_DRIVER = 'softpipe'
          $env:D3D10UMD_UMDDDI = '101'
          # The UMD's own log, for the video lines (removed at the end, so
          # the later steps start without one).
          New-Item -ItemType Directory -Force C:\mali\log | Out-Null
          function Run-Exe($tag, $exe, $argl) {
            $p = Start-Process -FilePath (Resolve-Path vt\$exe).Path -ArgumentList $argl -NoNewWindow -PassThru `
                   -RedirectStandardOutput "vdec-$tag.txt" -RedirectStandardError "vdec-$tag.err"
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; $c = 'hang' } else { $c = $p.ExitCode }
            Write-Host "===== ${tag}: $exe exit $c"
            Get-Content "vdec-$tag.txt", "vdec-$tag.err" -ErrorAction SilentlyContinue | Select-Object -Last 40 | Out-Host
            return $c
          }
          $stream = (Resolve-Path tests\data\testsrc-176x144-high.264).Path

          $env:D3D10UMD_UMDVIDEO = '0'
          $off = Run-Exe 'off' 'vdectest.exe' "`"$dll`" --probe"
          $env:D3D10UMD_UMDVIDEO = '1'
          $noprof = Run-Exe 'noprofiles' 'vdectest.exe' "`"$dll`" --probe"
          # 0079: the video processor and NV12 plane views, no decoder needed.
          $vpt = Run-Exe 'vp' 'vdectest.exe' "`"$dll`" --vp"
          $other = Run-Exe 'otherprocess' 'notaplayer.exe' "`"$dll`" --probe"
          $tri = Run-Exe 'triangle11' 'mpv.exe' "`"$dll`""
          $pres = Run-Exe 'present11' 'ffplay.exe' "`"$dll`""
          $env:D3D10UMD_UMDVIDEO = '2'
          $env:D3D10UMD_VDEC_FAKE = '1'
          $dec = Run-Exe 'decode' 'vdectest.exe' "`"$dll`" `"$stream`" --fake --vp"
          # 0083: the decoder texture as FFmpeg makes it (BIND_DECODER |
          # BIND_SHADER_RESOURCE, 0x208) with R8/R8G8 views over its slices,
          # made before the first decode and after decodes (the plane
          # textures come with the first view), every frame read through
          # them; and with zero copy off (D3D10UMD_VDEC_ZEROCOPY=0).
          $srv = Run-Exe 'srv' 'vdectest.exe' "`"$dll`" `"$stream`" --fake --srv"
          $srvlate = Run-Exe 'srvlate' 'vdectest.exe' "`"$dll`" `"$stream`" --fake --srv-late"
          $env:D3D10UMD_VDEC_ZEROCOPY = '0'
          $srvzc0 = Run-Exe 'srvzc0' 'vdectest.exe' "`"$dll`" `"$stream`" --fake --srv"
          Remove-Item Env:D3D10UMD_VDEC_ZEROCOPY
          # 0085: the plane views are aliases of the texture's memory; the
          # plane textures copied from it (D3D10UMD_NV12_ALIAS=0) are the
          # fallback for a driver without resource_alias. Every frame is
          # compared through the views with the staging read back, luma,
          # Cb and Cr (the fake decoder's Cb and Cr differ).
          $env:D3D10UMD_NV12_ALIAS = '0'
          $srvcopy = Run-Exe 'srvcopy' 'vdectest.exe' "`"$dll`" `"$stream`" --fake --srv"
          $srvcopylate = Run-Exe 'srvcopylate' 'vdectest.exe' "`"$dll`" `"$stream`" --fake --srv-late"
          Remove-Item Env:D3D10UMD_NV12_ALIAS
          # C3: the decoder texture as Chromium 158 makes it (an array,
          # MiscFlags SHARED, refused without a KMD so made unshared here),
          # the decoder at the container's size, ANGLE's plane views of
          # every slice made before decoding; --open is board-only (it needs
          # a shared texture) and says so.
          $chrtex = Run-Exe 'chrtex' 'vdectest.exe' "`"$dll`" `"$stream`" --fake --chromium-tex --open"
          # 0081: HEVC Main, VP9 profile 0, AV1 Main through the same path,
          # and the register files the UMD builds from what the runtime
          # handed it (D3D10UMD_VDEC_REGLOG) against vdpu383test
          # --dxva-only's for the same stream (tests/vdec-host/reglog.md5;
          # H.264 is checked on the host only: vdectest pads its bitstream,
          # vdpu383test does not, so the stream length register differs).
          $codecRuns = @()
          $n = 0
          foreach ($line in Get-Content tests\vdec-host\reglog.md5) {
            if ($line -match '^\s*#' -or -not $line.Trim()) { continue }
            $f = -split $line
            if ($f[0] -like '*.264') { continue }
            $n++
            $tag = "codec$n"
            $log = Join-Path $PWD "vdec-reglog-$tag.txt"
            Remove-Item $log -ErrorAction SilentlyContinue
            $env:D3D10UMD_VDEC_REGLOG = $log
            # UmdVideo 2, with UmdAv1Synth in bit 16 when the line asks for it.
            $env:D3D10UMD_UMDVIDEO = if ($line -match '--av1-synth 1') { '65538' } else { '2' }
            $c = Run-Exe $tag 'vdectest.exe' "`"$dll`" `"$((Resolve-Path tests\data\$($f[0])).Path)`" --fake"
            Remove-Item Env:D3D10UMD_VDEC_REGLOG
            $md5 = if (Test-Path $log) { (Get-FileHash -Algorithm MD5 $log).Hash.ToLower() } else { 'none' }
            Write-Host "===== ${tag}: $($f[0]) $($f[3..9] -join ' '): register log md5 $md5, vdpu383test's $($f[2])"
            $codecRuns += [pscustomobject]@{ Tag = $tag; Stream = $f[0]; Frames = $f[1]; Want = $f[2]; Got = $md5; Exit = $c }
          }
          $env:D3D10UMD_UMDVIDEO = '2'
          # What Chromium's D3D11VideoDecoder would get from this device:
          # printed, not a pass or fail yet (it needs feature level 11_0).
          $chr = Run-Exe 'chromium' 'vdectest.exe' "`"$dll`" --chromium"
          Remove-Item Env:D3D10UMD_VDEC_FAKE
          $env:D3D10UMD_UMDVIDEO = '2'
          $nodev = Run-Exe 'nodevice' 'vdectest.exe' "`"$dll`" --probe"
          Remove-Item Env:D3D10UMD_UMDVIDEO, Env:D3D10UMD_UMDDDI, Env:GALLIUM_DRIVER

          Get-ChildItem C:\mali\log -Filter 'vdectest*' | ForEach-Object {
            Write-Host "===== UMD log $($_.Name): video"
            Copy-Item $_.FullName "vdec-umdlog-$($_.Name)"
            Get-Content $_.FullName | Select-String 'video:|refused|NV12' | Select-Object -First 80 | ForEach-Object { $_.Line }
          }
          # The decoder's last line says what became of its NV12 textures
          # (0083): the 0x208 runs made plane textures, the run with
          # D3D10UMD_VDEC_ZEROCOPY=0 counted its texture as zero copy off.
          $nv12 = @(Get-ChildItem C:\mali\log -Filter 'vdectest*' | ForEach-Object { Get-Content $_.FullName } |
                    Select-String 'video: NV12 decoder textures:' | ForEach-Object { $_.Line })
          Write-Host "===== decoder texture counters"
          $nv12 | ForEach-Object { Write-Host $_ }
          if (-not ($nv12 -match 'plane views aliasing [1-9]')) { throw 'no decoder log line with plane views aliasing a 0x208 texture (0085)' }
          if (-not ($nv12 -match 'plane textures for [1-9]')) { throw 'no decoder log line with plane textures made for a 0x208 texture (D3D10UMD_NV12_ALIAS=0)' }
          if (-not ($nv12 -match '[1-9][0-9]* zero copy off')) { throw 'no decoder log line counting a texture with zero copy off' }
          Remove-Item -Recurse -Force C:\mali\log

          $t = @{}
          foreach ($k in 'off', 'noprofiles', 'vp', 'otherprocess', 'decode', 'nodevice', 'srv', 'srvlate', 'srvzc0', 'srvcopy', 'srvcopylate', 'chrtex') { $t[$k] = (Get-Content "vdec-$k.txt" -ErrorAction SilentlyContinue) -join "`n" }
          if ($off -eq 'hang' -or $off -eq 0) { throw "UmdVideo 0: a video device was created ($off)" }
          if ($t['off'] -match 'ID3D11VideoDevice: yes') { throw 'UmdVideo 0 offered a video device' }
          if ($noprof -ne 3 -or $t['noprofiles'] -notmatch 'ID3D11VideoDevice: yes' -or $t['noprofiles'] -notmatch 'decoder profiles: 0') { throw "UmdVideo 1: expected a video device with no profiles ($noprof)" }
          if ($other -eq 0 -or $t['otherprocess'] -match 'ID3D11VideoDevice: yes') { throw "UmdVideo 1 reached a process not on the list ($other)" }
          if ($tri -ne 0 -and $tri -ne 2) { throw "triangle.exe on the D3D11.1 interface failed ($tri)" }
          if ($pres -ne 0) { throw "present.exe on the D3D11.1 interface failed ($pres)" }
          if ($dec -ne 0 -or $t['decode'] -notmatch 'fake pattern: MATCH' -or $t['decode'] -notmatch 'frames out 12') { throw "decode through ID3D11VideoContext failed ($dec)" }
          if ($vpt -ne 0 -or $t['vp'] -notmatch 'video processor tests: PASS') { throw "video processor or NV12 plane views failed ($vpt)" }
          if ($t['decode'] -notmatch 'through the video processor: MATCH') { throw 'the decoded picture through the video processor did not match' }
          foreach ($r in @(@{ k = 'srv'; c = $srv }, @{ k = 'srvlate'; c = $srvlate }, @{ k = 'srvzc0'; c = $srvzc0 },
                           @{ k = 'srvcopy'; c = $srvcopy }, @{ k = 'srvcopylate'; c = $srvcopylate })) {
            $o = $t[$r.k]
            if ($r.c -ne 0 -or $o -notmatch 'BindFlags 0x208' -or $o -notmatch 'fake pattern: MATCH' -or $o -notmatch 'frames out 12' -or $o -notmatch 'through the plane views \([a-z ]+\): MATCH, 12 frames') { throw "0x208 decoder texture with plane views ($($r.k)) failed ($($r.c))" }
          }
          if ($nodev -ne 3 -or $t['nodevice'] -notmatch 'decoder profiles: 0') { throw "without \\.\VDPU383 the profile must not be offered ($nodev)" }
          $o = $t['chrtex']
          if ($chrtex -ne 0 -or $o -notmatch 'MiscFlags 0x2: ' -or $o -notmatch 'fake pattern: MATCH' -or
              $o -notmatch "through the plane views \(made before decoding, Chromium's texture unshared\): MATCH, 12 frames" -or
              $o -notmatch 'through a second device: not run') { throw "the decoder texture as Chromium makes it, through ANGLE's plane views, failed ($chrtex)" }
          if ($t['decode'] -notmatch 'decoder profiles: 4') { throw 'UmdVideo 2 with the decoder: expected 4 profiles (H.264, HEVC, VP9, AV1)' }
          if ($codecRuns.Count -lt 4) { throw "expected 4 HEVC/VP9/AV1 runs from reglog.md5, got $($codecRuns.Count)" }
          foreach ($r in $codecRuns) {
            $out = (Get-Content "vdec-$($r.Tag).txt" -ErrorAction SilentlyContinue) -join "`n"
            if ($r.Exit -ne 0 -or $out -notmatch 'fake pattern: MATCH' -or $out -notmatch "frames out $($r.Frames)\b") { throw "$($r.Stream) through ID3D11VideoContext failed ($($r.Exit))" }
            if ($r.Got -ne $r.Want) { throw "$($r.Stream): the UMD's register log ($($r.Got)) is not vdpu383test --dxva-only's ($($r.Want))" }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vdectest-arm64
          path: |
            vt/vdectest.exe
            tests/data/testsrc-176x144-high.264
            tests/data/testsrc-176x144-main.hevc
            tests/data/testsrc-176x144-p0.ivf
            tests/data/testsrc-352x288-2tiles.av1.ivf
            vdec-*.txt
            vdec-*.err

      - name: Feature level 11_0 for Chromium's GPU process only (fl11test, UmdReportFL11)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # 0080: with UmdReportFL11 (D3D10UMD_UMDFL11 stands in for it without
          # a KMD), msedge.exe/chrome.exe started with --type=gpu-process get
          # the D3D11.1 interface at 11_0 and shader model 5; every other
          # process, and that one without the switch, gets what it had.
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          New-Item -ItemType Directory -Force fl | Out-Null
          cl /nologo /W3 /O2 /EHsc /MD tools\windows\fl11test.cpp /Fe:fl\fl11test.exe
          if ($LASTEXITCODE) { throw 'fl11test build failed' }
          Copy-Item fl\fl11test.exe fl\msedge.exe
          Copy-Item vt\vdectest.exe fl\chrome.exe
          function Run-Fl($tag, $exe, $argl) {
            $p = Start-Process -FilePath (Resolve-Path fl\$exe).Path -ArgumentList $argl -NoNewWindow -PassThru `
                   -RedirectStandardOutput "fl-$tag.txt" -RedirectStandardError "fl-$tag.err"
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; $c = 'hang' } else { $c = $p.ExitCode }
            Write-Host "===== ${tag}: $exe $argl -> exit $c"
            Get-Content "fl-$tag.txt", "fl-$tag.err" -ErrorAction SilentlyContinue | Select-Object -Last 200 | Out-Host
            return $c
          }
          New-Item -ItemType Directory -Force C:\mali\log | Out-Null
          $env:GALLIUM_DRIVER = 'softpipe'
          $env:D3D10UMD_UMDDDI = '101'
          # The board's KMD is WDDM 1.3 or 2.0; D3D10UMD_KMT_WDDM gives the
          # software path that answer too. (It was not why the runtime
          # refused 11_0 at first, run 45536548061: the shader caps were.)
          $env:D3D10UMD_KMT_WDDM = '1300'
          $r = @{}
          # Off: the GPU process keeps 10_1.
          Remove-Item Env:D3D10UMD_UMDFL11 -ErrorAction SilentlyContinue
          $r['off'] = Run-Fl 'off' 'msedge.exe' "`"$dll`" --type=gpu-process"
          $env:D3D10UMD_UMDFL11 = '0'
          $r['zero'] = Run-Fl 'zero' 'msedge.exe' "`"$dll`" --type=gpu-process"
          $env:D3D10UMD_UMDFL11 = '1'
          # On, but not the GPU process: by name, and by --type.
          $r['name'] = Run-Fl 'name' 'fl11test.exe' "`"$dll`" --type=gpu-process"
          $r['browser'] = Run-Fl 'browser' 'msedge.exe' "`"$dll`""
          $r['renderer'] = Run-Fl 'renderer' 'msedge.exe' "`"$dll`" --type=renderer"
          # On, the GPU process: shader model 5 on softpipe, pixels checked.
          $r['gpu'] = Run-Fl 'gpu' 'msedge.exe' "`"$dll`" --type=gpu-process"
          # For the record only: the same with the WDDM 1.1 and 1.0 answers.
          $env:D3D10UMD_KMT_WDDM = '1105'
          $r['wddm11'] = Run-Fl 'wddm11' 'msedge.exe' "`"$dll`" --type=gpu-process"
          $env:D3D10UMD_KMT_WDDM = '1000'
          $r['wddm10'] = Run-Fl 'wddm10' 'msedge.exe' "`"$dll`" --type=gpu-process"
          $env:D3D10UMD_KMT_WDDM = '1300'
          # Also for the record: the other shader caps answers (0080's
          # D3D10UMD_FL11_EXP, software path only: 1 free threading, 2
          # doubles instead of shader 4.x compute, 4 none, which the runtime
          # refused in run 45537590835), the GPU process asking for 10_1
          # only, and UmdVideo's D3D11.1 device at 10_1.
          foreach ($e in 1, 2, 4) {
            $env:D3D10UMD_FL11_EXP = "$e"
            $r["exp$e"] = Run-Fl "exp$e" 'msedge.exe' "`"$dll`" --type=gpu-process"
          }
          Remove-Item Env:D3D10UMD_FL11_EXP
          $env:D3D10UMD_UMDVIDEO = '2'
          $r['ask101'] = Run-Fl 'ask101' 'chrome.exe' "`"$dll`" --probe --type=gpu-process"
          Remove-Item Env:D3D10UMD_UMDFL11
          $env:D3D10UMD_UMDVIDEO = '3'
          $r['video3'] = Run-Fl 'video3' 'chrome.exe' "`"$dll`" --probe"
          Remove-Item Env:D3D10UMD_UMDVIDEO
          $env:D3D10UMD_UMDFL11 = '1'
          # What Chromium's D3D11VideoDecoder sees at 11_0 (UmdVideo 2, fake
          # decoder): every step but the shared NV12 texture, which needs a KMD.
          $env:D3D10UMD_UMDVIDEO = '2'
          $env:D3D10UMD_VDEC_FAKE = '1'
          $r['chromium'] = Run-Fl 'chromium' 'chrome.exe' "`"$dll`" --chromium --fl11 --type=gpu-process"
          # Media Foundation's H.264 decoder on the same device (Edge's
          # MediaFoundationVideoDecoder path): printed, not checked.
          $r['mf'] = Run-Fl 'mf' 'chrome.exe' "`"$dll`" --mf --fl11 --type=gpu-process"
          Remove-Item Env:D3D10UMD_VDEC_FAKE, Env:D3D10UMD_UMDVIDEO

          # The same SM5 shaders through Panfrost on the emulated G52: the
          # TGSI from shader model 5 must get through tgsi_to_nir and the
          # Bifrost compiler. Nothing runs the jobs: pixels are not checked.
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          $r['panfrost'] = Run-Fl 'panfrost' 'msedge.exe' "`"$dll`" --type=gpu-process"
          Remove-Item Env:MALIKM_FAKE, Env:D3D10UMD_UMDFL11, Env:D3D10UMD_UMDDDI, Env:GALLIUM_DRIVER, Env:D3D10UMD_KMT_WDDM

          Get-ChildItem C:\mali\log | ForEach-Object {
            Copy-Item $_.FullName "fl-umdlog-$($_.Name)"
            Write-Host "===== UMD log $($_.Name)"
            Get-Content $_.FullName | Select-String 'video:|UmdReportFL11|pipeline level|3D pipeline|shader:|ddi-error|not carried out|XXX|GetCaps|QueryAdapterInfo: type|CalcPrivateDeviceSize|GetSupportedVersions|CreateDevice|CloseAdapter' | Select-Object -First 60 | ForEach-Object { $_.Line }
          }
          Remove-Item -Recurse -Force C:\mali\log

          $t = @{}
          foreach ($k in $r.Keys) { $t[$k] = (Get-Content "fl-$k.txt" -ErrorAction SilentlyContinue) -join "`n" }
          foreach ($k in 'off', 'zero', 'name', 'browser', 'renderer') {
            if ($r[$k] -ne 2 -or $t[$k] -notmatch 'feature level 10_1') { throw "${k}: expected feature level 10_1, exit 2 ($($r[$k]))" }
          }
          if ($r['gpu'] -ne 0 -or $t['gpu'] -notmatch 'feature level 11_0' -or $t['gpu'] -notmatch '(?m)^PASS') { throw "the GPU process at 11_0 failed ($($r['gpu']))" }
          if ($t['chromium'] -notmatch 'feature level 11_0 \(D3D11VideoDecoder needs 11_0\)') { throw 'the Chromium probe did not get 11_0' }
          # 0081 lists H.264, HEVC, VP9 and AV1; at 11_0 the probe must keep all four.
          if ($t['chromium'] -notmatch 'decoder profiles: 4') { throw 'the Chromium probe at 11_0 lost decoder profiles (want H.264, HEVC, VP9, AV1)' }
          if ($t['chromium'] -match 'blocked by: feature level') { throw 'the Chromium probe is still blocked by the feature level' }
          # Each codec as D3DVideoDecoder sets it up for 1080p: the config it
          # takes at the container's size and the decoder made with it
          # (H.264 with ConfigBitstreamRaw 2), the plane views of a slice.
          foreach ($c in @(@('H.264', 2), @('HEVC Main', 1), @('VP9 profile 0', 1), @('AV1 Main', 1))) {
            $sec = ($t['chromium'] -split "(?m)^  (?=\S)") | Where-Object { $_ -like "$($c[0]), 1080p*" }
            if (-not $sec) { throw "the Chromium probe did not set up $($c[0])" }
            if ($sec -notmatch "CreateVideoDecoder 1920x1080, ConfigBitstreamRaw $($c[1]): 0x00000000") { throw "Chromium's $($c[0]) decoder at 1920x1080 was not created" }
            if ($sec -notmatch 'R8G8 \(chroma\) view of slice \d+ \(ANGLE''s EGL image of plane 1\): 0x00000000') { throw "no chroma plane view for $($c[0])" }
          }
          if ($t['chromium'] -notmatch "H.264 VLD no FGT\s+Chromium's size probe: up to 4096x2304") { throw 'Chromium would list H.264 at its 1920x1088 default (size probe)' }
          if ($r['panfrost'] -eq 'hang' -or [int]$r['panfrost'] -lt 0 -or [int]$r['panfrost'] -gt 1) { throw "Panfrost on shader model 5: $($r['panfrost'])" }
          if ($t['panfrost'] -notmatch 'feature level 11_0') { throw 'Panfrost: not at 11_0' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fl11test-arm64
          path: |
            fl/fl11test.exe
            fl-*.txt
            fl-*.err
            fl-umdlog-*

      - name: The runtime's view of the multisample answers (d3dprobe, MALIKM_FAKE)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The D3D11 runtime checks the UMD's format answers while it creates
          # a device, and on the TaishanPi 3M refused it (0x887A0020) in
          # msedge.exe, where the UMD gives multisample answers, but not in
          # other processes. Here the runtime on the runner checks Panfrost's
          # answers for the emulated G52, through the software driver path:
          # D3D10UMD_UMDDDI and D3D10UMD_UMDMSAA stand in for maliwddm's
          # UmdDdi and UmdMsaa (mesa-patches/0067).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          $env:D3D10UMD_UMDDDI = '101'
          $env:D3D10UMD_UMDMSAA = '1'
          New-Item -ItemType Directory -Force C:\mali\log | Out-Null
          cl /nologo /W4 /WX /O2 /EHsc tools\windows\d3dprobe.cpp d3d11.lib dxgi.lib user32.lib /Fe:out\d3dprobe.exe
          if ($LASTEXITCODE) { throw 'd3dprobe build failed' }
          Copy-Item out\d3dprobe.exe out\msedge.exe
          Copy-Item out\d3dprobe.exe out\plainprobe.exe
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          $codes = @{}
          foreach ($exe in 'msedge', 'plainprobe') {
            $p = Start-Process -FilePath (Resolve-Path out\$exe.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "d3dprobe-$exe.txt" -RedirectStandardError "d3dprobe-$exe.err"
            if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; $codes[$exe] = 'hang' } else { $codes[$exe] = $p.ExitCode }
            Write-Host "===== $exe.exe: exit $($codes[$exe])"
            Get-Content "d3dprobe-$exe.txt" -ErrorAction SilentlyContinue
          }
          # The reference: what the runner's own adapters (WARP, the basic
          # render driver) answer, printed only; the UMD is not loaded here.
          Copy-Item out\d3dprobe.exe out\warpref.exe
          $p = Start-Process -FilePath (Resolve-Path out\warpref.exe).Path -NoNewWindow -PassThru `
                 -RedirectStandardOutput d3dprobe-warp.txt -RedirectStandardError d3dprobe-warp.err
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force }
          Write-Host "===== warpref.exe (the runner's adapters, for reference)"
          Get-Content d3dprobe-warp.txt -ErrorAction SilentlyContinue
          Get-ChildItem C:\mali\log | ForEach-Object {
            Write-Host "===== UMD log $($_.Name): format answers"
            Copy-Item $_.FullName "umdlog-$($_.Name)"
            Get-Content $_.FullName | Select-String 'caps:|OpenAdapter|CreateDevice' | Select-Object -First 400 | ForEach-Object { $_.Line }
          }
          $edge = (Get-Content d3dprobe-msedge.txt -ErrorAction SilentlyContinue) -join "`n"
          if ($codes['plainprobe'] -ne 0) { throw "the device without multisample answers was refused ($($codes['plainprobe']))" }
          if ($codes['msedge'] -ne 0) { throw "the device with the multisample answers (msedge.exe) was refused ($($codes['msedge']))" }
          if ($edge -notmatch 'feature level 10_1') { throw 'msedge.exe did not get feature level 10_1' }
          if ($edge -notmatch 'MSAA consistency: 0 disagreement') { throw 'msedge.exe: the multisample answers disagree' }
          # Chromium's steps after CreateDevice (d3dprobe "edge path"): the
          # device must not be removed by any of them.
          foreach ($exe in 'msedge', 'plainprobe') {
            $t = (Get-Content "d3dprobe-$exe.txt" -ErrorAction SilentlyContinue) -join "`n"
            if ($t -notmatch 'edge path: device alive') { throw "${exe}.exe: the device was removed on the edge path" }
          }
          if ($edge -notmatch '(?m)^ +28 R8G8B8A8_UNORM .* ms-rt.* q 1 0 1 0') { throw 'msedge.exe: R8G8B8A8_UNORM is not a multisample render target at 1x and 4x' }
          if ($edge -notmatch '(?m)^ +87 B8G8R8A8_UNORM .* ms-rt.* q 1 0 1 0') { throw 'msedge.exe: B8G8R8A8_UNORM is not a multisample render target at 1x and 4x' }

      - name: The UMD log from a low-integrity process (Edge's GPU process)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # Edge's GPU process runs at low integrity with a restricted token
          # and wrote no UMD log on the board (2026-11-23). triangle.exe
          # under another name, with a low label on the file, starts at low
          # integrity; it must get a log once C:\mali\log has the ACL and
          # label docs/EDGE-PRESENT.md sets up, and the log's first line
          # names the token (mesa-patches/0072).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          New-Item -ItemType Directory -Force C:\mali\log | Out-Null
          Copy-Item out\triangle.exe out\lowtri.exe
          icacls out\lowtri.exe /setintegritylevel low
          if ($LASTEXITCODE) { throw 'icacls on lowtri.exe failed' }
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          function Run-Low($tag) {
            $p = Start-Process -FilePath (Resolve-Path out\lowtri.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "low-$tag.out" -RedirectStandardError "low-$tag.err"
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; return 'hang' }
            return $p.ExitCode
          }
          $c = Run-Low 'before'
          $before = @(Get-ChildItem C:\mali\log -Filter 'lowtri.exe-*' -ErrorAction SilentlyContinue).Count
          Write-Host "low integrity, directory as made: exit $c, $before log(s)"
          # The setup in docs/EDGE-PRESENT.md, word for word.
          icacls C:\mali\log /grant '*S-1-1-0:(OI)(CI)M' '*S-1-5-12:(OI)(CI)M' '*S-1-15-2-1:(OI)(CI)M' '*S-1-15-2-2:(OI)(CI)M'
          if ($LASTEXITCODE) { throw 'icacls /grant failed' }
          icacls C:\mali\log /setintegritylevel '(OI)(CI)low'
          if ($LASTEXITCODE) { throw 'icacls /setintegritylevel failed' }
          $c = Run-Low 'after'
          $logs = @(Get-ChildItem C:\mali\log -Filter 'lowtri.exe-*' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime)
          Write-Host "low integrity, after the setup: exit $c, $($logs.Count) log(s)"
          if ($c -eq 'hang') { throw 'lowtri.exe hung' }
          if ($logs.Count -le $before) { throw 'no UMD log from the low-integrity process after the ACL setup' }
          $first = Get-Content $logs[-1].FullName -TotalCount 1
          Write-Host "first line: $first"
          Copy-Item $logs[-1].FullName umdlog-lowtri.txt
          if ($first -notmatch 'log on: .*integrity 0x1000 \(low\)') { throw 'the log does not name a low-integrity token' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panfrost-fake-trace
          path: |
            d3dprobe-*.txt
            d3dprobe-*.err
            umdlog-*
            fake.*
            fake-*.txt
            present.*
            present-*.txt
            gsso.*
            gsso-*.txt
            nolayout.*
            nolayout-*.txt
            low-*.out
            low-*.err
            trace.*
            trace/

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-arm64
          path: out/


  panfrost-emulated:
    # The same UMD for the processes Windows on Arm emulates: x64 (loaded
    # through the ARM64X forwarder below) and x86 (UserModeDriverNameWow,
    # SysWOW64). Built and smoke-tested natively on an x64 runner; Panfrost's
    # own code then runs emulated on the board. windows-2022, as the
    # driver build in ci.yml: its image has the WDK, whose UMD DDI headers
    # (d3dumddi.h, d3d10umddi.h) d3d10umd needs.
    name: d3d10umd + softpipe + Panfrost (${{ matrix.arch }})
    needs: libpan-spirv
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcvars: x64
            cflags: ''
          - arch: x86
            vcvars: amd64_x86
            cflags: '-m32 /arch:SSE2 '
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libpan-generated
          path: libpan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$pwd\ci\clc-stubs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBPAN_PREBUILT=$pwd\libpan" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          # The video decoder backend and the VDPU383 register builder (0078).
          Copy-Item -Recurse video mesa\src\gallium\frontends\d3d10umd\video
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Copy-Item include\maliwddm_abi.h mesa\include\win32-compat\
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }
      - name: Configure
        shell: pwsh
        run: |
          # clang-cl as on ARM64. For x86: a clang-cl.cfg next to clang-cl
          # with -m32, which clang reads by default, so that clang-cl itself
          # (and its --version, from which meson takes /MACHINE for lib and
          # lld-link) targets x86; /arch:SSE2 in c_args (cl's own default; a
          # bare -m32 is an i386 with no cmpxchg8b, whose 64-bit atomics are
          # calls into a libatomic Windows has not got); and a cross file that
          # says the host is x86. Tried and dropped: -m32 in the compiler list
          # (meson passed it to rc too), clang-cl under a triple-prefixed name
          # (meson took it for GNU clang), _CL_ (clang-cl appends it where the
          # linker gets it), -m32 in c_args alone (lib got /MACHINE:x64). It
          # runs on this x64 runner: no exe wrapper.
          # The C runtime is linked in (/MT): the board has no x64 or x86
          # vcruntime140.dll to count on, and the UMD must load without one.
          $cc = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin\clang-cl.exe'
          $c = $cc -replace '\\', '/'
          if ('${{ matrix.arch }}' -eq 'x86') {
            Set-Content -Encoding ascii (Join-Path (Split-Path $cc) 'clang-cl.cfg') '-m32'
            $t = (& $cc --version) -join "`n"
            if ($t -notmatch 'Target: i[3-6]86') { Write-Host $t; throw 'clang-cl.cfg was not read: clang-cl still targets 64-bit' }
            Set-Content -Encoding ascii cross.ini ("[binaries]`nc = '$c'`ncpp = '$c'`n" +
              "[properties]`nneeds_exe_wrapper = false`n" +
              "[host_machine]`nsystem = 'windows'`ncpu_family = 'x86'`ncpu = 'i686'`nendian = 'little'`n")
            Get-Content cross.ini
            $mfile = @('--cross-file', 'cross.ini')
          } else {
            Set-Content -Encoding ascii native.ini "[binaries]`nc = '$c'`ncpp = '$c'`n"
            $mfile = @('--native-file', 'native.ini')
          }
          & $cc --version
          meson setup build mesa --backend=ninja @mfile `
            -Dbuildtype=debugoptimized -Db_vscrt=mt `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-d3d10umd=true `
            -Dmesa-clc=system `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            "-Dc_args=${{ matrix.cflags }}-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert" "-Dcpp_args=${{ matrix.cflags }}-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert"
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 80 }; throw 'meson setup failed' }
          Select-String -Path build\meson-logs\meson-log.txt -Pattern 'Host machine cpu|Build machine cpu' | ForEach-Object { $_.Line }
      - name: Build
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern ' error C| error LNK|fatal error|error:' | Select-Object -First 80 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          dumpbin /nologo /headers $dll | Select-String 'machine' | Select-Object -First 2 | ForEach-Object { $_.Line }
          dumpbin /nologo /exports $dll | Select-String 'OpenAdapter' | ForEach-Object { $_.Line }

      - name: Smoke test (softpipe, then GALLIUM_DRIVER=panfrost)
        shell: pwsh
        run: |
          $dll = (Get-ChildItem build -Recurse -Filter libgallium_d3d10.dll | Select-Object -First 1).FullName
          if (-not $dll) { throw 'libgallium_d3d10.dll was not built' }
          cl /nologo /EHsc /O2 /MD tests\d3d11-triangle\triangle.cpp /Fe:triangle.exe
          if ($LASTEXITCODE) { throw 'test build failed' }
          cl /nologo /EHsc /O2 /MT tools\windows\emucheck.cpp /Fe:emucheck.exe
          if ($LASTEXITCODE) { throw 'emucheck build failed' }
          .\triangle.exe $dll
          if ($LASTEXITCODE) { throw "softpipe smoke test failed ($LASTEXITCODE)" }
          .\emucheck.exe sw $dll
          if ($LASTEXITCODE) { throw "emucheck on the DLL failed ($LASTEXITCODE)" }
          $env:GALLIUM_DRIVER = 'panfrost'
          .\triangle.exe $dll 2>&1 | Tee-Object pan.txt
          if ($LASTEXITCODE) { throw "panfrost fallback smoke test failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path pan.txt -Pattern 'Panfrost found no Mali device' -Quiet)) { throw 'Panfrost was not tried' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll, triangle.exe, emucheck.exe out\
          Copy-Item (Get-ChildItem build -Recurse -Filter libgallium_d3d10.pdb | Select-Object -First 1).FullName out\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-${{ matrix.arch }}
          path: out/

      - name: Panfrost on the emulated driver (MALIKM_FAKE)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # As on ARM64: Panfrost compiles the shaders and builds and submits
          # job chains to the shim's in-process stand-in for the kernel
          # driver. Here it is the x64 or x86 Panfrost doing it, pointers of
          # that size included; nothing executes the jobs (exit code 2 is
          # fine, the pixels are arbitrary).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '2'
          $dll = (Resolve-Path out\libgallium_d3d10.dll).Path
          $p = Start-Process -FilePath (Resolve-Path out\triangle.exe).Path -ArgumentList "`"$dll`"" -NoNewWindow -PassThru `
                 -RedirectStandardOutput fake.out -RedirectStandardError fake.err
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw 'triangle.exe hung' }
          $r = $p.ExitCode
          Get-Content fake.out, fake.err -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 40
          $all = (Get-Content fake.out, fake.err -ErrorAction SilentlyContinue) -join "`n"
          Write-Host "triangle.exe exit code $r"
          if ($all -match 'using softpipe') { throw 'fell back to softpipe' }
          if ($all -notmatch 'malikm-fake: submit') { throw 'no job was submitted' }
          if ($r -ne 0 -and $r -ne 2) { throw "triangle.exe died ($r)" }

  arm64x-forwarder:
    # maliumd.dll as an ARM64X pure forwarder (learn.microsoft.com/windows/
    # arm/arm64x-build): no code, two export tables. An ARM64 process that
    # loads it gets maliumd_arm64.dll in its place; an x64 process (or an
    # ARM64EC one) is sent to maliumd_x64.dll. The D3D runtime loads the
    # name in UserModeDriverName into both kinds of process, so the file it
    # names must be ARM64X; the forwarder makes it one without building Mesa
    # as ARM64EC.
    name: maliumd.dll, ARM64X forwarder
    needs: [panfrost, panfrost-emulated]
    # It needs the ARM64 and the x64 DLL, not the x86 one: a failed x86
    # build does not stop it (a missing x64 artifact fails the download).
    if: always() && needs.panfrost.result == 'success'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-arm64
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: mesa-d3d10umd-panfrost-x64
          path: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Link the forwarder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force fw, out | Out-Null
          # Forward every export the DLLs have: the runtime needs
          # OpenAdapter10 and OpenAdapter10_2 from a hardware UMD, and the
          # D3DKMT* ones from a software one (the CI test below).
          function Exports($dll) {
            dumpbin /nologo /exports $dll | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] }
            }
          }
          $ea = @(Exports arm64\libgallium_d3d10.dll)
          $ex = @(Exports x64\libgallium_d3d10.dll)
          Write-Host "exports: ARM64 $($ea.Count), x64 $($ex.Count)"
          if (-not ($ea -contains 'OpenAdapter10_2') -or -not ($ex -contains 'OpenAdapter10_2')) { throw 'OpenAdapter10_2 is not exported' }
          ("EXPORTS`n" + (($ea | ForEach-Object { "    $_ = maliumd_arm64.$_" }) -join "`n")) | Set-Content -Encoding ascii fw\maliumd_arm64.def
          ("EXPORTS`n" + (($ex | ForEach-Object { "    $_ = maliumd_x64.$_" }) -join "`n")) | Set-Content -Encoding ascii fw\maliumd_x64.def
          Set-Content -Encoding ascii fw\empty.cpp ''
          Push-Location fw
          cl /nologo /c /Foempty_arm64.obj empty.cpp
          if ($LASTEXITCODE) { throw 'cl (ARM64) failed' }
          cl /nologo /c /arm64EC /Foempty_x64.obj empty.cpp
          if ($LASTEXITCODE) { throw 'cl (ARM64EC) failed' }
          lib /nologo /machine:x64 /def:maliumd_x64.def /out:maliumd_x64.lib
          if ($LASTEXITCODE) { throw 'lib (x64) failed' }
          lib /nologo /machine:arm64 /def:maliumd_arm64.def /out:maliumd_arm64.lib
          if ($LASTEXITCODE) { throw 'lib (ARM64) failed' }
          link /nologo /dll /noentry /machine:arm64x /defArm64Native:maliumd_arm64.def /def:maliumd_x64.def `
            empty_arm64.obj empty_x64.obj /out:maliumd.dll maliumd_arm64.lib maliumd_x64.lib
          if ($LASTEXITCODE) { throw 'link (ARM64X) failed' }
          dumpbin /nologo /headers maliumd.dll | Select-String 'machine' | ForEach-Object { $_.Line }
          Pop-Location
          Copy-Item fw\maliumd.dll, fw\maliumd_arm64.def, fw\maliumd_x64.def out\
          Copy-Item arm64\libgallium_d3d10.dll out\maliumd_arm64.dll
          Copy-Item x64\libgallium_d3d10.dll out\maliumd_x64.dll

      - name: Load it from an ARM64 and an x64 process
        shell: pwsh
        run: |
          # A software device on the forwarder from both kinds of process:
          # the ARM64 one must end up in maliumd_arm64.dll, the x64 one
          # (emulated on this runner) in maliumd_x64.dll, and both draw.
          New-Item -ItemType Directory -Force t | Out-Null
          Copy-Item out\maliumd.dll, out\maliumd_arm64.dll, out\maliumd_x64.dll t\
          cl /nologo /EHsc /O2 /MD tools\windows\emucheck.cpp /Fe:t\emucheck-arm64.exe
          if ($LASTEXITCODE) { throw 'emucheck (ARM64) build failed' }
          Copy-Item x64\emucheck.exe t\emucheck-x64.exe
          $fwd = (Resolve-Path t\maliumd.dll).Path
          foreach ($n in 'arm64', 'x64') {
            Write-Host "== $n process"
            & ".\t\emucheck-$n.exe" sw $fwd 2>&1 | Tee-Object "t\$n.txt"
            $code = $LASTEXITCODE
            if ($code) { throw "emucheck-$n through the forwarder failed ($code)" }
            if (-not (Select-String -Path "t\$n.txt" -Pattern "maliumd_$n.dll" -Quiet)) { throw "the $n process did not load maliumd_$n.dll" }
          }
          Copy-Item t\arm64.txt, t\x64.txt out\

      - uses: actions/upload-artifact@v4
        with:
          name: maliumd-arm64x
          path: out/


  wgl:
    # OpenGL: Mesa's WGL frontend and target (libgallium_wgl.dll, the ICD
    # with the Drv* entry points) with Panfrost and softpipe, and Mesa's
    # opengl32.dll stand-in (targets/libgl-gdi), which calls those Drv*
    # entry points. Panfrost reaches the kernel driver through the shim's
    # stand-alone D3DKMT path (no runtime device in a GL process) and a
    # frame reaches the window through GDI (mesa-patches/0060). ARM64 for
    # native programs, x64 for emulated ones (behind an ARM64X forwarder,
    # below), x86 for WOW64 ones (OpenGLDriverNameWow).
    name: OpenGL ICD, Panfrost + softpipe (${{ matrix.arch }})
    needs: libpan-spirv
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: windows-11-arm
            pyarch: arm64
            vcvars: arm64
            llvm: ARM64
            cflags: ''
          - arch: x64
            os: windows-2022
            pyarch: x64
            vcvars: x64
            llvm: x64
            cflags: ''
          - arch: x86
            os: windows-2022
            pyarch: x64
            vcvars: amd64_x86
            llvm: x64
            cflags: '-m32 /arch:SSE2 '
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libpan-generated
          path: libpan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.pyarch }}
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$pwd\ci\clc-stubs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBPAN_PREBUILT=$pwd\libpan" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          # The video decoder backend and the VDPU383 register builder (0078).
          Copy-Item -Recurse video mesa\src\gallium\frontends\d3d10umd\video
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Copy-Item include\maliwddm_abi.h mesa\include\win32-compat\
          Get-ChildItem mesa-patches -Filter *.patch -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C mesa apply --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($_.Name)" }
          }
      - name: Configure
        shell: pwsh
        run: |
          # As the Direct3D jobs: clang-cl, and for x86 a clang-cl.cfg with
          # -m32 and a cross file (see panfrost-emulated). The C runtime is
          # linked in (/MT) for all three: an ICD is loaded into whatever
          # program asks for OpenGL, and must not depend on a runtime DLL
          # the board may not have; zlib, which the GL frontend links and
          # meson builds from its wrap, goes in as a static library for the
          # same reason (it was z-1.dll beside nothing). No d3d10umd here:
          # -Dopengl=true and the WGL target are the only frontend.
          $cc = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\${{ matrix.llvm }}\bin\clang-cl.exe'
          $c = $cc -replace '\\', '/'
          if ('${{ matrix.arch }}' -eq 'x86') {
            Set-Content -Encoding ascii (Join-Path (Split-Path $cc) 'clang-cl.cfg') '-m32'
            $t = (& $cc --version) -join "`n"
            if ($t -notmatch 'Target: i[3-6]86') { Write-Host $t; throw 'clang-cl.cfg was not read: clang-cl still targets 64-bit' }
            Set-Content -Encoding ascii cross.ini ("[binaries]`nc = '$c'`ncpp = '$c'`n" +
              "[properties]`nneeds_exe_wrapper = false`n" +
              "[host_machine]`nsystem = 'windows'`ncpu_family = 'x86'`ncpu = 'i686'`nendian = 'little'`n")
            $mfile = @('--cross-file', 'cross.ini')
          } else {
            Set-Content -Encoding ascii native.ini "[binaries]`nc = '$c'`ncpp = '$c'`n"
            $mfile = @('--native-file', 'native.ini')
          }
          & $cc --version
          meson setup build mesa --backend=ninja @mfile `
            -Dbuildtype=debugoptimized -Db_vscrt=mt -Dzlib:default_library=static `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-d3d10umd=false `
            -Dmesa-clc=system `
            '-Dvulkan-drivers=' `
            -Dllvm=disabled `
            -Dopengl=true -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            "-Dc_args=${{ matrix.cflags }}-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert" "-Dcpp_args=${{ matrix.cflags }}-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert"
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 80 }; throw 'meson setup failed' }
      - name: Build
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern ' error C| error LNK|fatal error|error:' | Select-Object -First 80 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($n in 'libgallium_wgl', 'opengl32') {
            $f = Get-ChildItem build -Recurse -Filter "$n.dll" | Select-Object -First 1
            if (-not $f) { throw "$n.dll was not built" }
            Copy-Item $f.FullName out\
            Copy-Item ($f.FullName -replace '\.dll$', '.pdb') out\ -ErrorAction SilentlyContinue
            dumpbin /nologo /headers $f.FullName | Select-String 'machine' | Select-Object -First 1 | ForEach-Object { "${n}: $($_.Line.Trim())" }
            $imp = @(dumpbin /nologo /dependents $f.FullName | Select-String '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() })
            Write-Host "  imports $($imp -join ', ')"
            # Only what every Windows has: a program loads the ICD from
            # System32 with nothing of ours beside it.
            $odd = @($imp | Where-Object { $_ -notmatch '^(kernel32|user32|gdi32|advapi32|ws2_32|ole32|shell32|libgallium_wgl|api-ms-win-[a-z0-9-]+)\.dll$' })
            if ($odd.Count) { throw "$n.dll imports $($odd -join ', ')" }
          }
          $ex = dumpbin /nologo /exports out\libgallium_wgl.dll | Select-String ' Drv[A-Za-z]+' | ForEach-Object { $_.Matches[0].Value.Trim() }
          Write-Host "Drv* exports: $(@($ex).Count): $($ex -join ' ')"
          if (@($ex).Count -lt 19) { throw 'libgallium_wgl.dll does not export the 19 Drv* entry points' }
          cl /nologo /EHsc /O2 /MT tools\windows\gltri.cpp /Fe:out\gltri.exe
          if ($LASTEXITCODE) { throw 'gltri build failed' }

      - name: OpenGL on softpipe, then on Panfrost over the emulated kernel driver
        timeout-minutes: 20
        shell: pwsh
        run: |
          $cdb = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\${{ matrix.arch }}\\' } | Select-Object -First 1).FullName
          $o32 = (Resolve-Path out\opengl32.dll).Path
          # One run of gltri.exe with a time limit; on a hang every thread's
          # stack, on a crash the faulting one.
          function Run-Gl($tag, $extra) {
            $p = Start-Process -FilePath (Resolve-Path out\gltri.exe).Path -ArgumentList "`"$o32`" $extra" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$tag.out" -RedirectStandardError "$tag.err"
            if (-not $p.WaitForExit(300000)) {
              Write-Host "${tag}: still running after 300 s, dumping threads"
              if ($cdb) { & $cdb -p $p.Id -y "$pwd\out" -c '.lines -e; ~*kn 40; q' 2>&1 | Out-File "$tag-hang.txt" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $code = 'hang'
            } else {
              $code = $p.ExitCode
              if ($code -lt 0 -and $cdb) {
                & $cdb -g -G -y "$pwd\out" -c '.lines -e; kn 40; r; q' (Resolve-Path out\gltri.exe).Path "`"$o32`"" $extra.Split(' ') 2>&1 | Out-File "$tag-crash.txt"
              }
            }
            # Everything shown goes to the host: a function's output is its
            # return value.
            Write-Host "== ${tag}: exit code $code"
            Get-Content "$tag.out" -ErrorAction SilentlyContinue | Out-Host
            Get-Content "$tag.err" -ErrorAction SilentlyContinue | Select-String -NotMatch 'ioctl|  ->' | Select-Object -Last 30 | ForEach-Object { "stderr: $($_.Line)" } | Out-Host
            foreach ($f in "$tag-hang.txt", "$tag-crash.txt") {
              if (Test-Path $f) { Get-Content $f | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 120 | Out-Host }
            }
            return $code
          }

          # 1. The ICD on softpipe: the frontend, the Drv* entry points and
          # the software present, with nothing of ours in the way.
          $env:GALLIUM_DRIVER = 'softpipe'
          $s = Run-Gl 'soft' '--expect softpipe'
          Remove-Item Env:GALLIUM_DRIVER

          # 2. No GALLIUM_DRIVER, as on the board: Panfrost first; with no
          # Mali it says so and softpipe draws.
          $f = Run-Gl 'fallback' '--expect softpipe'
          $ferr = (Get-Content fallback.err -ErrorAction SilentlyContinue) -join "`n"

          # 3. Panfrost on the shim's in-process stand-in for the kernel
          # driver: screen, GLSL to NIR to Bifrost, job chains submitted,
          # the present's readback and GDI blit. Nothing executes the jobs,
          # so the pixels are arbitrary (exit code 1).
          $env:GALLIUM_DRIVER = 'panfrost'
          $env:MALIKM_FAKE = '1'
          $k = Run-Gl 'fake' '--expect Panfrost'
          Remove-Item Env:MALIKM_FAKE, Env:GALLIUM_DRIVER
          $kout = (Get-Content fake.out -ErrorAction SilentlyContinue) -join "`n"
          $kerr = (Get-Content fake.err -ErrorAction SilentlyContinue) -join "`n"

          if ($s -ne 0) { throw "gltri on softpipe failed ($s)" }
          if ($f -ne 0) { throw "gltri with the default driver order failed ($f)" }
          if ($ferr -notmatch 'Panfrost found no Mali device') { throw 'Panfrost was not tried first' }
          if ($k -eq 'hang') { throw 'gltri on Panfrost hung' }
          if ($k -ne 0 -and $k -ne 1) { throw "gltri on Panfrost failed ($k)" }
          if ($kerr -match 'using softpipe') { throw 'Panfrost fell back to softpipe' }
          if ($kerr -notmatch 'malikm-fake: submit') { throw 'Panfrost submitted no job' }
          if ($kout -notmatch '(?m)^presents: ') { throw 'gltri on Panfrost did not get through its presents' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wgl-test-logs-${{ matrix.arch }}
          path: |
            soft.*
            fallback.*
            fake.*
            *-hang.txt
            *-crash.txt
            build.log

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-wgl-panfrost-${{ matrix.arch }}
          path: out/

  vulkan:
    # Vulkan: Mesa's panvk for the G52 (Bifrost v7, Vulkan 1.0, behind
    # PAN_I_WANT_A_BROKEN_VULKAN_DRIVER), on the same libdrm shim as the
    # Direct3D UMD and the OpenGL ICD (docs/VULKAN.md). The configuration is
    # the OpenGL ICD's ARM64 one plus -Dvulkan-drivers=panfrost, and the
    # patches in mesa-patches/vulkan/ go on after the shared series; only
    # this job applies them. vkprobe loads the ICD itself (the runner has no
    # Vulkan loader) and runs it on the shim's emulated kernel driver.
    name: Vulkan ICD, panvk (ARM64)
    needs: libpan-spirv
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libpan-generated
          path: libpan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja mako pyyaml packaging
          $u = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
          Invoke-WebRequest $u -OutFile wfb.zip
          Expand-Archive wfb.zip -DestinationPath C:\winflexbison
          "C:\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$pwd\ci\clc-stubs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBPAN_PREBUILT=$pwd\libpan" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Mesa source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:MESA_TAG $env:MESA_URL mesa
          Copy-Item -Recurse video mesa\src\gallium\frontends\d3d10umd\video
          Copy-Item -Recurse win32-compat mesa\include\win32-compat
          Copy-Item include\malikm_ioctl.h mesa\include\win32-compat\
          Copy-Item include\maliwddm_abi.h mesa\include\win32-compat\
          $all = @(Get-ChildItem mesa-patches -Filter *.patch | Sort-Object Name) +
                 @(Get-ChildItem mesa-patches\vulkan -Filter *.patch | Sort-Object Name)
          foreach ($p in $all) {
            Write-Host "applying $($p.Directory.Name)/$($p.Name)"
            git -C mesa apply --whitespace=nowarn $p.FullName
            if ($LASTEXITCODE) { throw "patch failed: $($p.Name)" }
          }
      - name: Configure
        shell: pwsh
        run: |
          $cc = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\ARM64\bin\clang-cl.exe'
          $c = $cc -replace '\\', '/'
          Set-Content -Encoding ascii native.ini "[binaries]`nc = '$c'`ncpp = '$c'`n"
          & $cc --version
          meson setup build mesa --backend=ninja --native-file native.ini `
            -Dbuildtype=debugoptimized -Db_vscrt=mt -Dzlib:default_library=static `
            -Dplatforms=windows `
            '-Dgallium-drivers=softpipe,panfrost' `
            -Dgallium-d3d10umd=false `
            -Dmesa-clc=system `
            '-Dvulkan-drivers=panfrost' `
            -Dllvm=disabled `
            -Dopengl=true -Dgles1=disabled -Dgles2=disabled `
            -Degl=disabled -Dglx=disabled -Dgbm=disabled `
            '-Dvideo-codecs=' -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false `
            -Dzstd=disabled -Dshader-cache=disabled -Dbuild-tests=false `
            '-Dc_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert' '-Dcpp_args=-DHAVE_FUNC_ATTRIBUTE_PACKED -D_wassert=mali_wassert'
          if ($LASTEXITCODE) { if (Test-Path build\meson-logs\meson-log.txt) { Get-Content build\meson-logs\meson-log.txt -Tail 80 }; throw 'meson setup failed' }
      - name: Build
        shell: pwsh
        run: |
          ninja -C build -k 0 2>&1 | Tee-Object build.log
          $fail = Select-String -Path build.log -Pattern 'FAILED:' | Measure-Object
          Write-Host "failed build steps: $($fail.Count)"
          Select-String -Path build.log -Pattern ' error C| error LNK|fatal error|error:|undefined symbol' | Select-Object -First 150 | ForEach-Object { $_.Line }
          if ($fail.Count -gt 0) { throw 'build failed' }
          New-Item -ItemType Directory -Force out | Out-Null
          $f = Get-ChildItem build -Recurse -Filter 'vulkan_panfrost.dll' | Select-Object -First 1
          if (-not $f) { throw 'vulkan_panfrost.dll was not built' }
          Copy-Item $f.FullName out\malivk_arm64.dll
          Copy-Item ($f.FullName -replace '\.dll$', '.pdb') out\malivk_arm64.pdb -ErrorAction SilentlyContinue
          dumpbin /nologo /headers out\malivk_arm64.dll | Select-String 'machine' | Select-Object -First 1 | ForEach-Object { "malivk_arm64.dll: $($_.Line.Trim())" }
          $imp = @(dumpbin /nologo /dependents out\malivk_arm64.dll | Select-String '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() })
          Write-Host "  imports $($imp -join ', ')"
          # Loaded into any program that asks for Vulkan, from the driver
          # store with nothing of ours beside it: only what every Windows has.
          $odd = @($imp | Where-Object { $_ -notmatch '^(kernel32|user32|gdi32|advapi32|ws2_32|ole32|shell32|dxgi|dcomp|api-ms-win-[a-z0-9-]+)\.dll$' })
          if ($odd.Count) { throw "malivk_arm64.dll imports $($odd -join ', ')" }
          $ex = @(dumpbin /nologo /exports out\malivk_arm64.dll | Select-String ' (vk_icd[A-Za-z]+|vkGetInstanceProcAddr)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          Write-Host "exports: $($ex -join ' ')"
          foreach ($n in 'vk_icdGetInstanceProcAddr', 'vk_icdNegotiateLoaderICDInterfaceVersion', 'vk_icdGetPhysicalDeviceProcAddr') {
            if (-not ($ex -contains $n)) { throw "$n is not exported" }
          }
          # The manifest the INF names in VulkanDriverName; the DLL is next to
          # it in the driver store, so the path is relative.
          $api = (Get-Content mesa\include\vulkan\vulkan_core.h | Select-String '#define VK_HEADER_VERSION (\d+)').Matches[0].Groups[1].Value
          $m = [ordered]@{ file_format_version = '1.0.1'; ICD = [ordered]@{ library_path = '.\malivk_arm64.dll'; library_arch = '64'; api_version = "1.0.$api" } }
          $m | ConvertTo-Json | Set-Content -Encoding ascii out\malivk.json
          Get-Content out\malivk.json
          cl /nologo /EHsc /O2 /MT /I mesa\include tools\windows\vkprobe.cpp /Fe:out\vkprobe.exe
          if ($LASTEXITCODE) { throw 'vkprobe build failed' }

      - name: panvk on the emulated kernel driver
        timeout-minutes: 20
        shell: pwsh
        run: |
          $cdb = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\arm64\\' } | Select-Object -First 1).FullName
          $exe = (Resolve-Path out\vkprobe.exe).Path
          $dll = (Resolve-Path out\malivk_arm64.dll).Path
          function Run-Vk($tag, $extra) {
            $p = Start-Process -FilePath $exe -ArgumentList "`"$dll`" $extra" -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$tag.out" -RedirectStandardError "$tag.err"
            if (-not $p.WaitForExit(300000)) {
              Write-Host "${tag}: still running after 300 s, dumping threads"
              if ($cdb) { & $cdb -p $p.Id -y "$pwd\out" -c '.lines -e; ~*kn 40; q' 2>&1 | Out-File "$tag-hang.txt" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $code = 'hang'
            } else {
              $code = $p.ExitCode
              if ($code -lt 0 -and $cdb) {
                & $cdb -g -G -y "$pwd\out" -c '.lines -e; kn 40; r; q' $exe "`"$dll`"" $extra.Split(' ') 2>&1 | Out-File "$tag-crash.txt"
              }
            }
            Write-Host "== ${tag}: exit code $code"
            Get-Content "$tag.out" -ErrorAction SilentlyContinue | Out-Host
            Get-Content "$tag.err" -ErrorAction SilentlyContinue | Select-Object -Last 60 | ForEach-Object { "stderr: $_" } | Out-Host
            foreach ($f in "$tag-hang.txt", "$tag-crash.txt") {
              if (Test-Path $f) { Get-Content $f | Select-String -NotMatch 'NatVis|ModLoad' | Select-Object -Last 120 | Out-Host }
            }
            return $code
          }

          # 1. No Mali and no emulation: the instance works and has no
          # physical device (panvk says why on stderr), exit 2.
          $n = Run-Vk 'nodev' ''

          # 2. The emulated kernel driver: device, memory types, the shim's
          # syncobj states, submissions, the CPU swap chain into a window.
          # Nothing executes the jobs, so buffer and image contents are not
          # judged (--emulated); the fence and event answers are.
          $env:MALIKM_FAKE = '1'
          $env:PANVK_DEBUG = 'startup'
          $k = Run-Vk 'fake' '--emulated --window 3'
          Remove-Item Env:MALIKM_FAKE, Env:PANVK_DEBUG
          $kout = (Get-Content fake.out -ErrorAction SilentlyContinue) -join "`n"
          $kerr = (Get-Content fake.err -ErrorAction SilentlyContinue) -join "`n"

          if ($n -ne 2) { throw "vkprobe with no Mali: exit $n, expected 2 (no device)" }
          if ($k -eq 'hang') { throw 'vkprobe on the emulated driver hung' }
          if ($k -ne 0) { throw "vkprobe on the emulated driver failed ($k)" }
          if ($kout -notmatch 'Mali-G52') { throw 'the device is not the Mali-G52' }
          if ($kerr -notmatch 'malikm-fake: submit') { throw 'panvk submitted no job' }
          if ($kout -notmatch 'window: \d+ frames') { throw 'no frames were presented' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-test-logs-arm64
          path: |
            nodev.*
            fake.*
            *-hang.txt
            *-crash.txt
            build.log

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-panvk-arm64
          path: out/

  wgl-arm64x:
    # maligl.dll, the name for OpenGLDriverName: an ARM64X pure forwarder as
    # maliumd.dll is (arm64x-forwarder above). Windows' opengl32.dll in an
    # ARM64 process and in an x64 one both load the file the adapter names
    # in OpenGLDriverName (only an x86 process is given the Wow value), so
    # the file must serve both; this one sends an ARM64 process to
    # maligl_arm64.dll and an x64 one to maligl_x64.dll. Tested here by
    # giving it the name Mesa's opengl32.dll stand-in imports.
    name: maligl.dll, ARM64X forwarder for the OpenGL ICD
    needs: wgl
    if: ${{ !cancelled() }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mesa-wgl-panfrost-arm64
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: mesa-wgl-panfrost-x64
          path: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Link the forwarder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force fw, out | Out-Null
          function Exports($dll) {
            dumpbin /nologo /exports $dll | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] }
            }
          }
          $ea = @(Exports arm64\libgallium_wgl.dll)
          $ex = @(Exports x64\libgallium_wgl.dll)
          Write-Host "exports: ARM64 $($ea.Count), x64 $($ex.Count)"
          foreach ($n in 'DrvCreateContext', 'DrvSetPixelFormat', 'DrvSwapBuffers', 'DrvValidateVersion', 'DrvSetCallbackProcs') {
            if (-not ($ea -contains $n) -or -not ($ex -contains $n)) { throw "$n is not exported" }
          }
          ("EXPORTS`n" + (($ea | ForEach-Object { "    $_ = maligl_arm64.$_" }) -join "`n")) | Set-Content -Encoding ascii fw\maligl_arm64.def
          ("EXPORTS`n" + (($ex | ForEach-Object { "    $_ = maligl_x64.$_" }) -join "`n")) | Set-Content -Encoding ascii fw\maligl_x64.def
          Set-Content -Encoding ascii fw\empty.cpp ''
          Push-Location fw
          cl /nologo /c /Foempty_arm64.obj empty.cpp
          if ($LASTEXITCODE) { throw 'cl (ARM64) failed' }
          cl /nologo /c /arm64EC /Foempty_x64.obj empty.cpp
          if ($LASTEXITCODE) { throw 'cl (ARM64EC) failed' }
          lib /nologo /machine:x64 /def:maligl_x64.def /out:maligl_x64.lib
          if ($LASTEXITCODE) { throw 'lib (x64) failed' }
          lib /nologo /machine:arm64 /def:maligl_arm64.def /out:maligl_arm64.lib
          if ($LASTEXITCODE) { throw 'lib (ARM64) failed' }
          link /nologo /dll /noentry /machine:arm64x /defArm64Native:maligl_arm64.def /def:maligl_x64.def `
            empty_arm64.obj empty_x64.obj /out:maligl.dll maligl_arm64.lib maligl_x64.lib
          if ($LASTEXITCODE) { throw 'link (ARM64X) failed' }
          dumpbin /nologo /headers maligl.dll | Select-String 'machine' | ForEach-Object { $_.Line }
          Pop-Location
          Copy-Item fw\maligl.dll, fw\maligl_arm64.def, fw\maligl_x64.def out\
          Copy-Item arm64\libgallium_wgl.dll out\maligl_arm64.dll
          Copy-Item x64\libgallium_wgl.dll out\maligl_x64.dll
          Copy-Item arm64\libgallium_wgl.pdb out\maligl_arm64.pdb -ErrorAction SilentlyContinue
          Copy-Item x64\libgallium_wgl.pdb out\maligl_x64.pdb -ErrorAction SilentlyContinue

      - name: Draw through it from an ARM64 and an x64 process
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Each process gets its own opengl32.dll stand-in (ARM64 or x64),
          # the forwarder under the name that stand-in imports, and both
          # targets. softpipe draws; what counts is which maligl_*.dll each
          # process ends up with.
          $env:GALLIUM_DRIVER = 'softpipe'
          foreach ($n in 'arm64', 'x64') {
            $d = "t-$n"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item out\maligl_arm64.dll, out\maligl_x64.dll $d\
            Copy-Item out\maligl.dll $d\libgallium_wgl.dll
            Copy-Item $n\opengl32.dll, $n\gltri.exe $d\
            Write-Host "== $n process"
            $p = Start-Process -FilePath (Resolve-Path $d\gltri.exe).Path -ArgumentList "`"$((Resolve-Path $d\opengl32.dll).Path)`" --expect softpipe" `
                   -NoNewWindow -PassThru -RedirectStandardOutput "$d\out.txt" -RedirectStandardError "$d\err.txt"
            if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw "gltri ($n) hung" }
            Get-Content "$d\out.txt", "$d\err.txt" -ErrorAction SilentlyContinue
            if ($p.ExitCode) { throw "gltri ($n) through the forwarder failed ($($p.ExitCode))" }
            if (-not (Select-String -Path "$d\out.txt" -Pattern "maligl_$n.dll" -Quiet)) { throw "the $n process did not load maligl_$n.dll" }
            Copy-Item "$d\out.txt" "out\gltri-$n.txt"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: maligl-arm64x
          path: out/
